# fly.toml app configuration file generated for g2g-ai-pool on 2026-05-22T01:28:23+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'g2g-ai-pool'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  AIRTABLE_BASE = 'appRQwVddDxQdU6P3'
  ARBITRAGE_ENABLED = 'true'
  GOV_SLA_PREMIUM = '0.10'
  MARKUP_BASE = '3.5'
  MARKUP_BLENDED_TARGET = '4.0'
  MARKUP_FLOOR = '3.0'
  PORT = '8080'
  QUOTA_DEGRADE_THRESHOLD = '0.85'
  USD_TO_THB = '36.0'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
