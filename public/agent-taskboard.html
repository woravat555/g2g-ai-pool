<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2G Agent Task Board — ระบบบริหารงาน AI</title>
<style>
  :root {
    --navy: #0d1b2e;
    --navy2: #162236;
    --navy3: #1e3352;
    --accent: #3b82f6;
    --accent2: #60a5fa;
    --green: #22c55e;
    --yellow: #f59e0b;
    --red: #ef4444;
    --orange: #f97316;
    --purple: #a855f7;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --card: #1a2d47;
    --border: #2d4a6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--navy);
    color: var(--text);
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    font-size: 18px;
    min-height: 100vh;
  }
  /* ─── Header ─── */
  header {
    background: var(--navy2);
    border-bottom: 2px solid var(--border);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo {
    background: var(--accent);
    color: #fff;
    font-weight: 800;
    font-size: 20px;
    padding: 6px 14px;
    border-radius: 8px;
    letter-spacing: 1px;
  }
  h1 { font-size: 22px; font-weight: 700; color: var(--text); }
  h1 span { color: var(--accent2); }
  .header-right { display: flex; align-items: center; gap: 14px; }
  #refresh-status { color: var(--text2); font-size: 15px; }
  #countdown { color: var(--accent2); font-weight: 700; min-width: 28px; text-align: right; }
  /* ─── Create button ─── */
  .btn-create {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .btn-create:hover { background: #2563eb; }
  /* ─── Board ─── */
  .board-wrap {
    padding: 28px 20px;
    overflow-x: auto;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(4, minmax(280px, 1fr));
    gap: 20px;
    min-width: 1100px;
  }
  .column {
    background: var(--navy2);
    border-radius: 14px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 500px;
  }
  .col-header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 14px 14px 0 0;
  }
  .col-title { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .col-count {
    background: var(--navy3);
    color: var(--text2);
    font-size: 14px;
    padding: 2px 10px;
    border-radius: 20px;
    font-weight: 600;
  }
  .col-pending .col-header { border-top: 3px solid var(--text2); }
  .col-in_progress .col-header { border-top: 3px solid var(--yellow); }
  .col-completed .col-header { border-top: 3px solid var(--green); }
  .col-failed .col-header { border-top: 3px solid var(--red); }
  .col-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  /* ─── Task Card ─── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: default;
    transition: border-color 0.2s, transform 0.1s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .task-id { color: var(--text2); font-size: 13px; font-weight: 600; letter-spacing: 0.5px; white-space: nowrap; }
  .priority-badge {
    font-size: 12px;
    padding: 2px 9px;
    border-radius: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .pri-critical { background: #7f1d1d; color: #fca5a5; }
  .pri-high     { background: #7c2d12; color: #fdba74; }
  .pri-normal   { background: #1e3a5f; color: #93c5fd; }
  .pri-low      { background: #1c2d1e; color: #86efac; }
  .card-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 10px; line-height: 1.4; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .type-badge {
    font-size: 12px;
    padding: 2px 9px;
    border-radius: 12px;
    font-weight: 600;
  }
  .type-build     { background: #312e81; color: #a5b4fc; }
  .type-research  { background: #064e3b; color: #6ee7b7; }
  .type-review    { background: #4c1d95; color: #c4b5fd; }
  .type-monitor   { background: #1e3a5f; color: #93c5fd; }
  .type-personal-ai { background: #701a75; color: #f0abfc; }
  .type-deploy    { background: #713f12; color: #fde68a; }
  .assigned-to {
    font-size: 13px;
    color: var(--text2);
    display: flex; align-items: center; gap: 4px;
  }
  .assigned-to::before { content: "👤"; font-size: 12px; }
  .created-at { font-size: 12px; color: var(--text2); margin-left: auto; }
  .card-result {
    margin-top: 10px;
    font-size: 13px;
    color: #86efac;
    background: #0d2318;
    border-radius: 6px;
    padding: 6px 10px;
    border-left: 3px solid var(--green);
    line-height: 1.4;
  }
  .card-error {
    margin-top: 10px;
    font-size: 13px;
    color: #fca5a5;
    background: #1f0a0a;
    border-radius: 6px;
    padding: 6px 10px;
    border-left: 3px solid var(--red);
    line-height: 1.4;
  }
  .empty-col {
    color: var(--text2);
    font-size: 15px;
    text-align: center;
    padding: 40px 10px;
    opacity: 0.5;
  }
  /* ─── Modal ─── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--navy2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 32px 28px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .modal h2 { font-size: 22px; font-weight: 800; margin-bottom: 24px; color: var(--accent2); }
  .form-row { margin-bottom: 18px; }
  label { display: block; font-size: 15px; color: var(--text2); margin-bottom: 6px; font-weight: 600; }
  input[type=text], select, textarea {
    width: 100%;
    background: var(--navy3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 17px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type=text]:focus, select:focus, textarea:focus { border-color: var(--accent); }
  select option { background: var(--navy3); }
  textarea { resize: vertical; min-height: 70px; }
  .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
  .btn-cancel {
    background: var(--navy3);
    color: var(--text2);
    border: 1px solid var(--border);
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-cancel:hover { background: var(--border); }
  .btn-submit {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 26px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-submit:hover { background: #2563eb; }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  /* ─── Toast ─── */
  #toast {
    position: fixed;
    bottom: 28px; right: 28px;
    background: var(--navy3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 22px;
    font-size: 16px;
    color: var(--text);
    z-index: 300;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
    max-width: 340px;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.success { border-color: var(--green); color: #86efac; }
  #toast.error { border-color: var(--red); color: #fca5a5; }
  /* ─── Loading ─── */
  #loading {
    text-align: center;
    padding: 80px 0;
    color: var(--text2);
    font-size: 18px;
  }
  .spinner {
    display: inline-block;
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">G2G</div>
    <h1>Agent Task Board — <span>ระบบบริหารงาน AI</span></h1>
  </div>
  <div class="header-right">
    <div id="refresh-status">รีเฟรชใน <span id="countdown">30</span>s</div>
    <button class="btn-create" onclick="openModal()">+ สร้าง Task ใหม่</button>
  </div>
</header>

<div class="board-wrap">
  <div id="loading">
    <div class="spinner"></div><br>
    กำลังโหลด tasks จาก Airtable...
  </div>
  <div class="board" id="board" style="display:none;">
    <div class="column col-pending" id="col-pending">
      <div class="col-header">
        <div class="col-title">📋 Pending</div>
        <div class="col-count" id="cnt-pending">0</div>
      </div>
      <div class="col-body" id="body-pending"></div>
    </div>
    <div class="column col-in_progress" id="col-in_progress">
      <div class="col-header">
        <div class="col-title">⚡ In Progress</div>
        <div class="col-count" id="cnt-in_progress">0</div>
      </div>
      <div class="col-body" id="body-in_progress"></div>
    </div>
    <div class="column col-completed" id="col-completed">
      <div class="col-header">
        <div class="col-title">✅ Completed</div>
        <div class="col-count" id="cnt-completed">0</div>
      </div>
      <div class="col-body" id="body-completed"></div>
    </div>
    <div class="column col-failed" id="col-failed">
      <div class="col-header">
        <div class="col-title">❌ Failed</div>
        <div class="col-count" id="cnt-failed">0</div>
      </div>
      <div class="col-body" id="body-failed"></div>
    </div>
  </div>
</div>

<!-- Create Task Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2>สร้าง Task ใหม่</h2>
    <div class="form-row">
      <label>Title (ชื่องาน) *</label>
      <input type="text" id="f-title" placeholder="เช่น Build LINE Webhook Handler">
    </div>
    <div class="form-row">
      <label>Type</label>
      <select id="f-type">
        <option value="">— เลือก type —</option>
        <option value="build">build</option>
        <option value="research">research</option>
        <option value="review">review</option>
        <option value="monitor">monitor</option>
        <option value="personal-ai">personal-ai</option>
        <option value="deploy">deploy</option>
      </select>
    </div>
    <div class="form-row">
      <label>Assigned To (Agent)</label>
      <input type="text" id="f-assigned" placeholder="เช่น build-agent, research-agent">
    </div>
    <div class="form-row">
      <label>Priority</label>
      <select id="f-priority">
        <option value="normal">normal</option>
        <option value="high">high</option>
        <option value="critical">critical</option>
        <option value="low">low</option>
      </select>
    </div>
    <div class="form-row">
      <label>Created By</label>
      <input type="text" id="f-created-by" placeholder="เช่น aiboss, ceo">
    </div>
    <div class="form-row">
      <label>Parent Task ID (ถ้ามี)</label>
      <input type="text" id="f-parent" placeholder="เช่น TASK-001">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
      <button class="btn-submit" id="btn-submit" onclick="submitTask()">สร้าง Task</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  const COLS = ["pending", "in_progress", "completed", "failed"];
  let refreshTimer = null;
  let countdownVal = 30;
  let countdownTimer = null;

  function typeBadge(type) {
    if (!type) return "";
    return `<span class="type-badge type-${type}">${type}</span>`;
  }

  function priorityBadge(pri) {
    if (!pri) return "";
    return `<span class="priority-badge pri-${pri}">${pri}</span>`;
  }

  function formatDate(d) {
    if (!d) return "";
    return d.slice(0, 10);
  }

  function buildCard(task) {
    const result = task.Result ? `<div class="card-result">✅ ${escHtml(task.Result)}</div>` : "";
    const errLog = task.ErrorLog ? `<div class="card-error">⚠️ ${escHtml(task.ErrorLog)}</div>` : "";
    return `
      <div class="card">
        <div class="card-top">
          <span class="task-id">${escHtml(task.TaskID || "—")}</span>
          ${priorityBadge(task.Priority)}
        </div>
        <div class="card-title">${escHtml(task.Title || "(ไม่มีชื่อ)")}</div>
        <div class="card-meta">
          ${typeBadge(task.Type)}
          ${task.AssignedTo ? `<span class="assigned-to">${escHtml(task.AssignedTo)}</span>` : ""}
          <span class="created-at">${formatDate(task.CreatedAt)}</span>
        </div>
        ${result}${errLog}
      </div>`;
  }

  function escHtml(s) {
    if (!s) return "";
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  async function loadBoard() {
    try {
      const r = await fetch("/api/tasks/board");
      const d = await r.json();
      if (!d.ok) { showToast("โหลดข้อมูลล้มเหลว: " + JSON.stringify(d.error), "error"); return; }
      document.getElementById("loading").style.display = "none";
      document.getElementById("board").style.display = "grid";
      const board = d.board;
      // in_progress key in API
      const mapping = { pending: "pending", in_progress: "in_progress", blocked: "pending", completed: "completed", failed: "failed" };
      // Reset cols
      COLS.forEach(col => {
        document.getElementById("body-" + col).innerHTML = "";
        document.getElementById("cnt-" + col).textContent = "0";
      });
      let counts = { pending: 0, in_progress: 0, completed: 0, failed: 0 };
      for (const [key, tasks] of Object.entries(board)) {
        const colKey = mapping[key] || "pending";
        for (const task of tasks) {
          document.getElementById("body-" + colKey).innerHTML += buildCard(task);
          counts[colKey] = (counts[colKey] || 0) + 1;
        }
      }
      COLS.forEach(col => {
        const cnt = counts[col] || 0;
        document.getElementById("cnt-" + col).textContent = cnt;
        if (cnt === 0) {
          document.getElementById("body-" + col).innerHTML = '<div class="empty-col">ไม่มี task ในขณะนี้</div>';
        }
      });
    } catch (e) {
      showToast("เชื่อมต่อ API ไม่ได้: " + e.message, "error");
    }
  }

  function startCountdown() {
    clearInterval(countdownTimer);
    countdownVal = 30;
    document.getElementById("countdown").textContent = countdownVal;
    countdownTimer = setInterval(() => {
      countdownVal--;
      document.getElementById("countdown").textContent = countdownVal;
      if (countdownVal <= 0) {
        countdownVal = 30;
        loadBoard();
      }
    }, 1000);
  }

  function openModal() {
    document.getElementById("modal-overlay").classList.add("open");
    document.getElementById("f-title").focus();
  }

  function closeModal() {
    document.getElementById("modal-overlay").classList.remove("open");
    ["f-title","f-assigned","f-created-by","f-parent"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("f-type").value = "";
    document.getElementById("f-priority").value = "normal";
  }

  async function submitTask() {
    const title = document.getElementById("f-title").value.trim();
    if (!title) { showToast("กรุณากรอก Title", "error"); return; }
    const btn = document.getElementById("btn-submit");
    btn.disabled = true;
    btn.textContent = "กำลังสร้าง...";
    try {
      const body = {
        title,
        type: document.getElementById("f-type").value || undefined,
        assigned_to: document.getElementById("f-assigned").value.trim() || undefined,
        priority: document.getElementById("f-priority").value || "normal",
        created_by: document.getElementById("f-created-by").value.trim() || undefined,
        parent_task_id: document.getElementById("f-parent").value.trim() || undefined,
      };
      const r = await fetch("/api/tasks/create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const d = await r.json();
      if (!d.ok) { showToast("สร้างไม่สำเร็จ: " + JSON.stringify(d.error), "error"); return; }
      showToast("สร้าง " + d.task_id + " เรียบร้อย!", "success");
      closeModal();
      await loadBoard();
      startCountdown();
    } catch (e) {
      showToast("Error: " + e.message, "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "สร้าง Task";
    }
  }

  // Close modal on overlay click
  document.getElementById("modal-overlay").addEventListener("click", function(e) {
    if (e.target === this) closeModal();
  });

  // Keyboard ESC to close
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

  function showToast(msg, type) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "show " + (type || "");
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => { t.className = ""; }, 3500);
  }

  // Init
  loadBoard();
  startCountdown();
</script>
<script src="/access-bar.js"></script>
</body>
</html>
