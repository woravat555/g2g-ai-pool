<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>G2G Farm AI · ชาวนา</title>
<link rel="manifest" href="data:application/json,{}">
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;600;700&family=Sarabun:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#06040f;--bg1:#0e0a22;--bg2:#160f30;--bg3:#1e1540;
  --glass:rgba(255,255,255,0.05);--glass2:rgba(255,255,255,0.09);
  --border:rgba(255,255,255,0.10);--border2:rgba(255,255,255,0.18);
  --gold:#d4a843;--gold-s:#f0c960;--gold-d:#8a6820;--gold-pale:rgba(212,168,67,0.15);
  --text:#f0eaf8;--text2:rgba(220,200,255,0.65);--text3:rgba(180,160,240,0.4);
  --cr-color:#eab308;--cr-soft:#fde047;--cr-dark:#713f12;--cr-glass:rgba(234,179,8,0.15);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg0);color:var(--text);font-family:'Sarabun',sans-serif;min-height:100vh;max-width:480px;margin:0 auto;overflow-x:hidden}
#splash{position:fixed;inset:0;background:linear-gradient(160deg,var(--bg0) 0%,var(--bg2) 50%,#1a1000 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .5s}
.splash-icon{font-size:72px;margin-bottom:16px;filter:drop-shadow(0 0 24px #eab30899)}
.splash-brand{font-family:'Bai Jamjuree',sans-serif;font-size:28px;font-weight:700;background:linear-gradient(90deg,var(--gold),var(--gold-s),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
.splash-sub{color:var(--text2);font-size:15px;margin-top:8px}
.splash-loader{width:120px;height:3px;background:var(--glass2);border-radius:4px;margin-top:32px;overflow:hidden}
.splash-loader::after{content:'';display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-s));border-radius:4px;animation:load 1.4s ease forwards}
@keyframes load{from{width:0}to{width:100%}}
#app{display:none;flex-direction:column;min-height:100vh}
.top-bar{background:linear-gradient(180deg,var(--bg1) 0%,transparent 100%);padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.top-logo{font-family:'Bai Jamjuree',sans-serif;font-size:16px;font-weight:700;color:var(--gold)}
.top-week{font-size:12px;color:var(--text2);text-align:right}
.crop-tabs{display:flex;gap:8px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none}
.crop-tabs::-webkit-scrollbar{display:none}
.ctab{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--glass);font-size:13px;color:var(--text2);cursor:pointer;transition:all .2s;font-family:'Sarabun',sans-serif}
.ctab.active{border-color:var(--cr-color);background:var(--cr-glass);color:var(--cr-soft);font-weight:600}
.phase-banner{margin:0 16px 12px;border-radius:16px;padding:16px;border:1px solid var(--border2);transition:background .4s}
.phase-season{font-size:22px;margin-bottom:4px}
.phase-stage{font-size:13px;color:var(--text2)}
.phase-period{font-size:12px;color:var(--text3);margin-top:2px}
.nav-tabs{display:flex;padding:0 16px;gap:6px;margin-bottom:4px}
.ntab{flex:1;padding:8px 4px;border-radius:12px;border:1px solid var(--border);background:var(--glass);font-size:12px;color:var(--text2);cursor:pointer;text-align:center;transition:all .2s;font-family:'Sarabun',sans-serif}
.ntab.active{border-color:var(--border2);background:var(--glass2);color:var(--text)}
.tab-content{display:none;padding:0 16px 80px;flex:1}
.tab-content.active{display:block}
.week-card{background:var(--glass);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;overflow:hidden;transition:all .2s}
.week-card.current{border-color:rgba(212,168,67,0.4)}
.wc-header{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.wc-num{font-size:11px;color:var(--text3)}
.wc-season{font-size:14px;font-weight:600}
.wc-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--gold-pale);color:var(--gold)}
.wc-arrow{color:var(--text3);font-size:14px;transition:transform .2s}
.wc-body{display:none;padding:0 14px 12px;border-top:1px solid var(--border)}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.task-item:last-child{border-bottom:none}
.task-check{width:20px;height:20px;border-radius:6px;border:1px solid var(--border2);background:var(--glass);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .2s;margin-top:1px}
.task-check.done{background:var(--cr-glass);border-color:var(--cr-color);color:var(--cr-soft)}
.task-text{flex:1}
.task-title{font-size:13px;color:var(--text)}
.task-title.done{text-decoration:line-through;color:var(--text3)}
.task-desc{font-size:11px;color:var(--text3);margin-top:2px}
.section-title{font-family:'Bai Jamjuree',sans-serif;font-size:14px;font-weight:600;color:var(--text2);margin:16px 0 10px;letter-spacing:.5px}
.tool-card{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.tool-title{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.input-row{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.input-label{font-size:12px;color:var(--text2);min-width:64px}
.num-input{flex:1;background:var(--glass2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:14px;font-family:'Sarabun',sans-serif;outline:none}
.num-input:focus{border-color:var(--border2)}
.calc-btn{width:100%;padding:10px;border-radius:10px;border:1px solid var(--cr-color);background:var(--cr-glass);color:var(--cr-soft);font-size:14px;font-family:'Sarabun',sans-serif;cursor:pointer;font-weight:600}
.result-box{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:10px;font-size:13px;line-height:1.8;color:var(--text2);display:none}
.market-card{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.mc-name{font-size:14px;font-weight:600}
.mc-type{font-size:11px;color:var(--text3);margin-top:2px}
.mc-price{text-align:right}
.mc-val{font-size:16px;font-weight:700;color:var(--cr-soft)}
.mc-unit{font-size:10px;color:var(--text3)}
.mc-trend{font-size:11px;margin-top:2px}
.trend-up{color:#22c55e}.trend-dn{color:#ef4444}
.iot-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.iot-card{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.iot-icon{font-size:28px;margin-bottom:6px}
.iot-val{font-size:22px;font-weight:700;font-family:'Bai Jamjuree',sans-serif}
.iot-lbl{font-size:11px;color:var(--text2);margin-top:2px}
.iot-sub{font-size:10px;color:var(--text3)}
.alert-card{background:rgba(234,179,8,0.1);border:1px solid rgba(234,179,8,0.3);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.alert-icon{font-size:18px;flex-shrink:0}
.iot-update{font-size:11px;color:var(--text3);text-align:center;margin-top:8px}
</style>
</head>
<body>
<div id="splash">

    <button class="ntab" onclick="switchTab('iot',this)">📡 IoT</button>

</div>

function getPeriodForWeek(crop,week){
  const periods=FARM_PERIODS[crop]||FARM_PERIODS.jasmine;
  return periods.find(p=>week>=p.w[0]&&week<=p.w[1])||periods[0];
}

function getPhaseGradient(crop,season){
  const c=CROPS[crop]||{};const color=c.color||'#eab308';const dark=c.dark||'#713f12';
  if(season.includes('เตรียม')||season.includes('พัก'))return`linear-gradient(135deg,#0a2010 0%,#1a4a20 60%,${color}22 100%)`;
  if(season.includes('หว่าน')||season.includes('ปักดำ'))return`linear-gradient(135deg,#0d2b18 0%,#1e5530 50%,${color}33 100%)`;
  if(season.includes('แตกกอ')||season.includes('เจริญ'))return`linear-gradient(135deg,#0d2b18 0%,${color}44 60%,rgba(6,4,15,0.8) 100%)`;
  if(season.includes('ตั้งท้อง')||season.includes('ออกรวง'))return`linear-gradient(135deg,#2a0a1a 0%,#7a1a4a 50%,${color}44 100%)`;
  if(season.includes('พัฒนา'))return`linear-gradient(135deg,${dark}cc 0%,${color}55 60%,rgba(6,4,15,0.8) 100%)`;
  if(season.includes('เก็บ'))return`linear-gradient(135deg,#2a1a00 0%,#7a4400 50%,#d4a84333 100%)`;
  return`linear-gradient(135deg,${dark}aa 0%,${color}44 100%)`;
}

let currentCrop='jasmine';
const currentWeek=(()=>{const now=new Date();const start=new Date(now.getFullYear(),0,1);return Math.min(52,Math.ceil((now-start)/604800000));})();

function buildCropTabs(){
  const el=document.getElementById('cropTabs');
  el.innerHTML=Object.values(CROPS).map(c=>`<button class="ctab${c.key===currentCrop?' active':''}" onclick="selectCrop('${c.key}')">${c.emoji} ${c.name}</button>`).join('');
}

function selectCrop(key){
  currentCrop=key;
  document.querySelectorAll('.ctab').forEach((b,i)=>{
    b.classList.toggle('active',Object.keys(CROPS)[i]===key);
  });
  const c=CROPS[key];
  document.querySelectorAll('.ctab').forEach(b=>{
    if(b.textContent.includes(c.name)){
      b.style.borderColor=c.color;b.style.background=c.glass;b.style.color=c.soft;
    } else {b.style.borderColor='';b.style.background='';b.style.color='';}
  });
  updateBanner();renderWeeks();
}

function updateBanner(){
  const p=getPeriodForWeek(currentCrop,currentWeek);
  const banner=document.getElementById('phaseBanner');
  banner.style.background=getPhaseGradient(currentCrop,p.season);
  document.getElementById('phaseSeason').textContent=p.season;
  document.getElementById('phaseStage').textContent=p.stage;
  document.getElementById('phasePeriod').textContent=p.period;
}

function getTaskKey(crop,week,idx){return`tk_${crop}_${week}_${idx}`;}

function toggleTask(dk,idx){
  const key=`${dk}_${idx}`;
  const done=localStorage.getItem(key)==='1';
  localStorage.setItem(key,done?'0':'1');
  const check=document.querySelector(`[data-tk="${key}"]`);
  const title=document.querySelector(`[data-tt="${key}"]`);
  if(check){check.classList.toggle('done',!done);check.textContent=done?'':' ✓';}
  if(title){title.classList.toggle('done',!done);}
}

function toggleCard(w){
  const body=document.getElementById(`wbody_${w}`);
  const arrow=document.getElementById(`warrow_${w}`);
  if(!body)return;
  const open=body.style.display==='block';
  body.style.display=open?'none':'block';
  if(arrow)arrow.style.transform=open?'':'rotate(90deg)';
}

function renderWeeks(){
  const el=document.getElementById('tab-week');
  const periods=FARM_PERIODS[currentCrop];
  const c=CROPS[currentCrop];
  let html='';
  periods.forEach(p=>{
    for(let w=p.w[0];w<=p.w[1];w++){
      const isCurrent=w===currentWeek;
      const dk=`tk_${currentCrop}_${w}`;
      const tasksDone=p.tasks.filter((_,i)=>localStorage.getItem(`${dk}_${i}`)==='1').length;
      const pct=Math.round(tasksDone/p.tasks.length*100);
      html+=`<div class="week-card${isCurrent?' current':''}" id="wcard_${w}">
        <div class="wc-header" onclick="toggleCard(${w})">
          <div><div class="wc-num">สัปดาห์ที่ ${w}${isCurrent?' · สัปดาห์นี้':''}</div><div class="wc-season">${p.season}</div></div>
          <div style="display:flex;align-items:center;gap:8px">
            ${pct>0?`<div class="wc-badge">${pct}%</div>`:''}

          </div>
        </div>
        <div class="wc-body" id="wbody_${w}" style="display:${isCurrent?'block':'none'}">
          ${p.tasks.map((t,i)=>{const done=localStorage.getItem(`${dk}_${i}`)==='1';return`<div class="task-item">
            <div class="task-check${done?' done':''}" data-tk="${dk}_${i}" onclick="toggleTask('${dk}',${i})">${done?' ✓':''}</div>
            <div class="task-text"><div class="task-title${done?' done':''}" data-tt="${dk}_${i}">${t.t}</div>${t.d?`<div class="task-desc">${t.d}</div>`:''}</div>

        </div>
      </div>`;
    }
  });
  el.innerHTML=html;
}

function calcNPK(){
  const rai=parseFloat(document.getElementById('npk-rai').value)||0;
  const rate=parseFloat(document.getElementById('npk-rate').value)||0;
  const type=document.getElementById('npk-type').value;
  const total=rai*rate;
  const cost=type==='46-0-0'?total*14:type==='16-20-0'?total*18:total*20;
  const r=document.getElementById('npk-result');
  r.style.display='block';
  r.innerHTML=`ปุ๋ย ${type} สำหรับ ${rai} ไร่<br>อัตรา ${rate} กก./ไร่<br><b style="color:var(--cr-soft)">ต้องการ: ${total.toLocaleString()} กก.</b><br>ต้นทุนประมาณ: ฿${cost.toLocaleString()}`;
}

function calcWater(){
  const rai=parseFloat(document.getElementById('w-rai').value)||0;
  const cm=parseFloat(document.getElementById('w-cm').value)||0;
  const sqm=rai*1600;const liters=sqm*cm*10;const cubic=liters/1000;
  const r=document.getElementById('w-result');
  r.style.display='block';
  r.innerHTML=`พื้นที่ ${rai} ไร่ ระดับน้ำ ${cm} ซม.<br>ปริมาณน้ำที่ต้องการ:<br><b style="color:var(--cr-soft)">${cubic.toLocaleString()} ลบ.ม. (${liters.toLocaleString()} ลิตร)</b>`;
}

  if(parseFloat(temp)>34)alerts.push({icon:'🌡',msg:'อุณหภูมิสูง ระวังความเครียดของพืช'});
  document.getElementById('tab-iot').innerHTML=`
  <div class="section-title">📡 เซ็นเซอร์อัจฉริยะ</div>
  <div class="iot-grid">
    <div class="iot-card"><div class="iot-icon">🌡</div><div class="iot-val" style="color:#f97316">${temp}°C</div><div class="iot-lbl">อุณหภูมิ</div><div class="iot-sub">อากาศ</div></div>
    <div class="iot-card"><div class="iot-icon">💧</div><div class="iot-val" style="color:#38bdf8">${water} ซม.</div><div class="iot-lbl">ระดับน้ำ</div><div class="iot-sub">ในแปลง</div></div>
    <div class="iot-card"><div class="iot-icon">🌊</div><div class="iot-val" style="color:#818cf8">${humid}%</div><div class="iot-lbl">ความชื้น</div><div class="iot-sub">อากาศ</div></div>
    <div class="iot-card"><div class="iot-icon">🌱</div><div class="iot-val" style="color:#22c55e">${soil}%</div><div class="iot-lbl">ความชื้น</div><div class="iot-sub">ดิน</div></div>
  </div>
  ${alerts.map(a=>`<div class="alert-card"><div class="alert-icon">${a.icon}</div><div>${a.msg}</div></div>`).join('')}
  <div class="iot-update">อัปเดตอัตโนมัติทุก 30 วินาที</div>`;
  if(!iotInterval)iotInterval=setInterval(()=>{if(document.getElementById('tab-iot').classList.contains('active'))renderIoT();},30000);
}

function switchTab(name,btn){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.ntab').forEach(b=>b.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  btn.classList.add('active');
  if(name==='iot')renderIoT();
}

function init(){
  const now=new Date();
  document.getElementById('topWeek').innerHTML=`สัปดาห์ที่ ${currentWeek}<br>${now.toLocaleDateString('th-TH',{day:'numeric',month:'short'})}`;
  buildCropTabs();selectCrop('jasmine');renderTools();renderMarket();
}

function startApp(){
  document.getElementById('splash').style.opacity='0';
  setTimeout(()=>{document.getElementById('splash').style.display='none';const app=document.getElementById('app');app.style.display='flex';init();},500);
}
setTimeout(startApp,1500);
</script>
</body>
</html>
