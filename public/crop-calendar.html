<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2G ปฏิทินเพาะปลูก 52 สัปดาห์ — Crop Calendar</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Sarabun','Noto Sans Thai',-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#0d2818 0%,#1a3d2a 50%,#0a1f12 100%);color:#e8f5e8;min-height:100vh;padding:14px;overflow-x:hidden}
  .wrap{max-width:1280px;margin:0 auto}
  header{background:rgba(0,0,0,.35);backdrop-filter:blur(12px);border-radius:18px;padding:18px 22px;margin-bottom:16px;border:1px solid rgba(102,255,153,.18)}
  h1{font-size:22px;font-weight:800;background:linear-gradient(135deg,#66ff99,#33cc66);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
  .subtitle{font-size:13px;color:#9be3a8;opacity:.85}
  .toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
  .toolbar select,.toolbar button,.toolbar input{background:rgba(255,255,255,.08);color:#e8f5e8;border:1px solid rgba(102,255,153,.25);padding:11px 14px;border-radius:10px;font-size:14px;font-family:inherit;cursor:pointer;transition:.15s}
  .toolbar select:focus,.toolbar input:focus{outline:none;border-color:#66ff99;background:rgba(255,255,255,.12)}
  .toolbar button{background:linear-gradient(135deg,#33cc66,#1a8c44);font-weight:600;border:none}
  .toolbar button:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(51,204,102,.4)}
  .toolbar button.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(102,255,153,.25)}
  .toolbar button.danger{background:linear-gradient(135deg,#ff6b3a,#cc4422)}
  .summary-card{background:rgba(0,0,0,.3);border:1px solid rgba(102,255,153,.2);border-radius:14px;padding:16px 18px;margin-bottom:14px}
  .summary-card h2{font-size:18px;margin-bottom:8px;color:#9be3a8}
  .summary-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:#c9eed1;margin-bottom:8px}
  .summary-meta span{background:rgba(102,255,153,.12);padding:4px 10px;border-radius:6px}
  .summary-text{font-size:13px;line-height:1.6;color:#b8d4bf}
  .grid{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;margin-bottom:14px;background:rgba(0,0,0,.2);padding:6px;border-radius:12px}
  .grid .head{background:rgba(102,255,153,.18);color:#9be3a8;font-size:11px;padding:6px 4px;text-align:center;border-radius:6px;font-weight:700}
  .week-cell{background:rgba(255,255,255,.06);border:1px solid rgba(102,255,153,.1);border-radius:6px;padding:5px 3px;text-align:center;cursor:pointer;font-size:10px;line-height:1.3;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.15s;position:relative}
  .week-cell:hover{background:rgba(102,255,153,.18);border-color:#66ff99;transform:scale(1.05)}
  .week-cell.active{background:linear-gradient(135deg,#33cc66,#1a8c44);border-color:#66ff99;font-weight:700;color:#fff;box-shadow:0 0 12px rgba(102,255,153,.5)}
  .week-cell.today{background:linear-gradient(135deg,#ff9933,#cc6600);border-color:#ffcc66;font-weight:700;color:#fff;box-shadow:0 0 18px rgba(255,153,51,.6)}
  .week-cell.harvest{border-left:3px solid #ffcc33}
  .week-cell.flowering{border-left:3px solid #ff99cc}
  .week-cell .wk{font-size:10px;font-weight:700;color:#9be3a8}
  .week-cell .ph{font-size:8px;color:#b8d4bf;opacity:.85;max-height:20px;overflow:hidden}
  .week-cell.active .ph,.week-cell.today .ph{color:#fff}
  .week-cell .alert{position:absolute;top:1px;right:2px;font-size:8px}
  .detail-panel{background:rgba(0,0,0,.4);border:1px solid rgba(102,255,153,.25);border-radius:14px;padding:18px;margin-bottom:14px;display:none}
  .detail-panel.show{display:block}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(102,255,153,.15)}
  .detail-title{font-size:18px;font-weight:700;color:#fff}
  .detail-week{font-size:12px;color:#9be3a8;display:block;margin-top:2px}
  .detail-phase{background:linear-gradient(135deg,#33cc66,#1a8c44);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;color:#fff}
  .task-list{list-style:none;margin:10px 0}
  .task-list li{padding:10px 12px;margin-bottom:6px;background:rgba(102,255,153,.07);border-left:3px solid #33cc66;border-radius:6px;font-size:14px;line-height:1.5;display:flex;gap:10px}
  .task-list li::before{content:counter(task);counter-increment:task;width:24px;height:24px;background:#33cc66;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
  .task-list{counter-reset:task}
  .warning-section{margin-top:12px;padding:12px;background:rgba(255,153,51,.08);border:1px solid rgba(255,153,51,.3);border-radius:8px}
  .warning-section .lbl{font-size:12px;color:#ffcc66;font-weight:700;margin-bottom:6px}
  .warning-section ul{list-style:none}
  .warning-section li{font-size:13px;color:#ffdda3;padding:4px 0 4px 18px;position:relative}
  .warning-section li::before{content:"⚠";position:absolute;left:0;top:4px}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(102,255,153,.15)}
  .actions button{flex:1;min-width:140px;background:linear-gradient(135deg,#33cc66,#1a8c44);color:#fff;border:none;padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  .actions button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(51,204,102,.35)}
  .actions button.edit{background:linear-gradient(135deg,#3399ff,#0066cc)}
  .actions button.broadcast{background:linear-gradient(135deg,#ff6b3a,#cc4422)}
  .edit-area{display:none;margin-top:14px;padding:14px;background:rgba(0,0,0,.3);border-radius:10px;border:1px solid rgba(51,153,255,.3)}
  .edit-area.show{display:block}
  .edit-area label{display:block;font-size:12px;color:#9be3a8;margin-bottom:4px;margin-top:8px}
  .edit-area input,.edit-area textarea{width:100%;background:rgba(255,255,255,.08);color:#e8f5e8;border:1px solid rgba(102,255,153,.25);padding:8px 10px;border-radius:6px;font-size:13px;font-family:inherit;resize:vertical}
  .edit-area button{margin-top:10px;background:linear-gradient(135deg,#33cc66,#1a8c44);color:#fff;border:none;padding:9px 18px;border-radius:7px;cursor:pointer;font-weight:600}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#33cc66,#1a8c44);color:#fff;padding:12px 24px;border-radius:30px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:9999;opacity:0;transition:.3s}
  .toast.show{opacity:1;bottom:30px}
  .toast.err{background:linear-gradient(135deg,#ff4444,#cc0000)}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px;font-size:12px;color:#b8d4bf}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend .sw{display:inline-block;width:14px;height:14px;border-radius:3px}
  .loading{text-align:center;padding:40px;color:#9be3a8}
  @media (max-width:768px){
    h1{font-size:18px}
    .grid{grid-template-columns:repeat(7,1fr)}
    .grid .head:nth-child(n+8){display:none}
    .week-cell .ph{font-size:7px}
    .actions button{min-width:100%}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ปฏิทินเพาะปลูก 52 สัปดาห์</h1>
    <div class="subtitle">G2G AgriTech — Crop Calendar System | ข้อมูลเกษตรกรรมไทยจริง</div>
  </header>

  <div class="toolbar">
    <select id="cropSel"><option value="">-- เลือกพืช --</option></select>
    <select id="provSel">
      <option value="">-- ทุกจังหวัด --</option>
      <option value="phrae">แพร่</option>
      <option value="chiangrai">เชียงราย</option>
      <option value="udonthani">อุดรธานี</option>
    </select>
    <button id="todayBtn">วันนี้ (สัปดาห์ที่ <span id="todayWk">-</span>)</button>
    <button id="adminBtn" class="secondary">โหมดแอดมิน</button>
  </div>

  <div class="legend">
    <span><span class="sw" style="background:#33cc66"></span>เลือก</span>
    <span><span class="sw" style="background:#ff9933"></span>วันนี้</span>
    <span><span class="sw" style="background:#ffcc33"></span>เก็บเกี่ยว</span>
    <span><span class="sw" style="background:#ff99cc"></span>ออกดอก</span>
    <span>⚠ เตือนสภาพอากาศ</span>
  </div>

  <div id="summaryCard" class="summary-card" style="display:none">
    <h2 id="cropName">-</h2>
    <div class="summary-meta">
      <span id="cropEn">-</span>
      <span id="cropSci">-</span>
      <span id="cropZones">-</span>
    </div>
    <div class="summary-text" id="cropCycle">-</div>
  </div>

  <div id="gridArea"></div>

  <div id="detailPanel" class="detail-panel">
    <div class="detail-head">
      <div>
        <div class="detail-title" id="dTitle">-</div>
        <span class="detail-week" id="dWeek">-</span>
      </div>
      <div class="detail-phase" id="dPhase">-</div>
    </div>
    <ol class="task-list" id="dTasks"></ol>
    <div class="warning-section" id="dWarnings" style="display:none">
      <div class="lbl">ข้อควรระวัง</div>
      <ul id="dWarnList"></ul>
    </div>
    <div class="actions">
      <button class="broadcast" id="bcBtn">ส่งแจ้งเตือน LINE</button>
      <button class="edit" id="editBtn">แก้ไข (Admin)</button>
    </div>
    <div class="edit-area" id="editArea">
      <label>ระยะการเจริญ (Phase)</label>
      <input type="text" id="eFPhase">
      <label>งานที่ 1</label>
      <textarea id="eF1" rows="2"></textarea>
      <label>งานที่ 2</label>
      <textarea id="eF2" rows="2"></textarea>
      <label>งานที่ 3</label>
      <textarea id="eF3" rows="2"></textarea>
      <label>ข้อควรระวัง (1 บรรทัด/ข้อ)</label>
      <textarea id="eWarn" rows="3"></textarea>
      <button onclick="saveEdit()">บันทึก</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>
</div>

<script>
const API_BASE = window.location.origin;
const API_KEY = 'phrae2026'; // valid for all provinces
let currentCrop = null;
let currentWeek = null;
let allCrops = [];
let isAdmin = false;

// ISO Week calculation
function getISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}
const TODAY_WK = getISOWeek(new Date());
document.getElementById('todayWk').textContent = TODAY_WK;

function toast(msg, err=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err?' err':'');
  setTimeout(()=>t.classList.remove('show'), 2800);
}

async function loadCropsList(){
  try {
    const r = await fetch(`${API_BASE}/api/crops/list`, { headers: { 'x-api-key': API_KEY }});
    const data = await r.json();
    if (!data.ok) throw new Error(data.error||'load failed');
    allCrops = data.crops;
    renderCropDropdown();
  } catch(e) {
    toast('โหลดรายการพืชไม่สำเร็จ: '+e.message, true);
  }
}

function renderCropDropdown(){
  const sel = document.getElementById('cropSel');
  const prov = document.getElementById('provSel').value;
  sel.innerHTML = '<option value="">-- เลือกพืช --</option>';
  let list = allCrops;
  if (prov) {
    const provMap = { phrae:'แพร่', chiangrai:'เชียงราย', udonthani:'อุดรธานี' };
    list = allCrops.filter(c => (c.growing_zones||[]).some(z => z.includes(provMap[prov])));
  }
  list.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.crop_code;
    opt.textContent = `${c.crop_name_th} (${c.crop_name_en})`;
    sel.appendChild(opt);
  });
}

async function loadCrop(code){
  if (!code) {
    document.getElementById('summaryCard').style.display = 'none';
    document.getElementById('gridArea').innerHTML = '';
    document.getElementById('detailPanel').classList.remove('show');
    return;
  }
  try {
    const r = await fetch(`${API_BASE}/api/crops/${code}`, { headers: { 'x-api-key': API_KEY }});
    const data = await r.json();
    if (!data.ok) throw new Error(data.error||'load failed');
    currentCrop = data.crop;
    renderSummary();
    renderGrid();
    if (TODAY_WK <= 52) selectWeek(TODAY_WK);
  } catch(e) {
    toast('โหลดข้อมูลพืชไม่สำเร็จ: '+e.message, true);
  }
}

function renderSummary(){
  const c = currentCrop;
  document.getElementById('cropName').textContent = c.crop_name_th;
  document.getElementById('cropEn').textContent = c.crop_name_en;
  document.getElementById('cropSci').textContent = c.scientific_name;
  document.getElementById('cropZones').textContent = '🌍 ' + (c.growing_zones||[]).slice(0,5).join(', ');
  document.getElementById('cropCycle').textContent = c.annual_cycle_summary;
  document.getElementById('summaryCard').style.display = 'block';
}

function renderGrid(){
  const ga = document.getElementById('gridArea');
  ga.innerHTML = '<div class="grid" id="g"></div>';
  const g = document.getElementById('g');
  const months = ['สัปดาห์','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  months.forEach(m => {
    const h = document.createElement('div');
    h.className = 'head';
    h.textContent = m;
    g.appendChild(h);
  });
  // 13-col layout: col 1 = week range label, col 2-13 = months
  // Build per-month buckets of 4-5 weeks each
  const weeks = currentCrop.weeks;
  const monthBuckets = {};
  weeks.forEach(w => {
    if (!monthBuckets[w.month]) monthBuckets[w.month] = [];
    monthBuckets[w.month].push(w);
  });
  const monthOrder = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const maxRows = Math.max(...Object.values(monthBuckets).map(b=>b.length));
  for (let row=0; row<maxRows; row++){
    const lbl = document.createElement('div');
    lbl.className = 'head';
    lbl.textContent = `แถว ${row+1}`;
    g.appendChild(lbl);
    monthOrder.forEach(m => {
      const wk = (monthBuckets[m]||[])[row];
      if (!wk) {
        const empty = document.createElement('div');
        empty.style.minHeight = '46px';
        g.appendChild(empty);
        return;
      }
      const cell = document.createElement('div');
      cell.className = 'week-cell';
      if (wk.week === currentWeek) cell.classList.add('active');
      if (wk.week === TODAY_WK) cell.classList.add('today');
      const phase = (wk.phase||'').toLowerCase();
      if (phase.includes('เก็บเกี่ยว') || phase.includes('harvest')) cell.classList.add('harvest');
      if (phase.includes('ดอก') || phase.includes('flower')) cell.classList.add('flowering');
      cell.innerHTML = `<div class="wk">W${wk.week}</div><div class="ph">${(wk.phase||'').substring(0,18)}</div>` +
        (wk.weather_dependent ? '<span class="alert">⚠</span>' : '');
      cell.onclick = () => selectWeek(wk.week);
      g.appendChild(cell);
    });
  }
}

function selectWeek(n){
  currentWeek = n;
  renderGrid();
  const wk = currentCrop.weeks.find(w => w.week === n);
  if (!wk) return;
  document.getElementById('dTitle').textContent = currentCrop.crop_name_th;
  document.getElementById('dWeek').textContent = `สัปดาห์ที่ ${wk.week} • ${wk.month}`;
  document.getElementById('dPhase').textContent = wk.phase;
  const tl = document.getElementById('dTasks');
  tl.innerHTML = '';
  (wk.tasks||[]).forEach(t => {
    const li = document.createElement('li');
    li.textContent = t;
    tl.appendChild(li);
  });
  const ws = document.getElementById('dWarnings');
  const wl = document.getElementById('dWarnList');
  if (wk.warnings && wk.warnings.length) {
    ws.style.display = 'block';
    wl.innerHTML = '';
    wk.warnings.forEach(w => {
      const li = document.createElement('li');
      li.textContent = w;
      wl.appendChild(li);
    });
  } else {
    ws.style.display = 'none';
  }
  document.getElementById('detailPanel').classList.add('show');
  document.getElementById('editArea').classList.remove('show');
  // pre-fill edit area
  document.getElementById('eFPhase').value = wk.phase||'';
  document.getElementById('eF1').value = wk.tasks?.[0]||'';
  document.getElementById('eF2').value = wk.tasks?.[1]||'';
  document.getElementById('eF3').value = wk.tasks?.[2]||'';
  document.getElementById('eWarn').value = (wk.warnings||[]).join('\n');
  // scroll
  document.getElementById('detailPanel').scrollIntoView({behavior:'smooth', block:'nearest'});
}

async function broadcastWeek(){
  if (!currentCrop || !currentWeek) return;
  const wk = currentCrop.weeks.find(w => w.week === currentWeek);
  if (!wk) return;
  const prov = document.getElementById('provSel').value || 'phrae';
  const msg = `🌾 ${currentCrop.crop_name_th} — สัปดาห์ที่ ${wk.week} (${wk.month})\n📍 ${wk.phase}\n\n` +
    wk.tasks.map((t,i) => `${i+1}. ${t}`).join('\n') +
    (wk.warnings?.length ? `\n\n⚠ ระวัง: ${wk.warnings.join(' | ')}` : '') +
    `\n\n— G2G AgriTech`;
  if (!confirm('ยืนยันส่ง LINE broadcast?\n\nเนื้อหา:\n' + msg.substring(0,400))) return;
  try {
    const r = await fetch(`${API_BASE}/api/farmer/broadcast`, {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':API_KEY},
      body: JSON.stringify({ province: prov, crop_code: currentCrop.crop_code, week: wk.week, message: msg })
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error||'broadcast failed');
    toast(`ส่งสำเร็จ! (${data.target||'logged'})`);
  } catch(e) {
    toast('ส่งไม่สำเร็จ: '+e.message, true);
  }
}

async function saveEdit(){
  if (!currentCrop || !currentWeek) return;
  const body = {
    phase: document.getElementById('eFPhase').value,
    tasks: [
      document.getElementById('eF1').value,
      document.getElementById('eF2').value,
      document.getElementById('eF3').value
    ].filter(t=>t.trim()),
    warnings: document.getElementById('eWarn').value.split('\n').map(s=>s.trim()).filter(Boolean)
  };
  try {
    const r = await fetch(`${API_BASE}/api/crops/${currentCrop.crop_code}/week/${currentWeek}`, {
      method:'PUT',
      headers:{'Content-Type':'application/json','x-api-key':API_KEY},
      body: JSON.stringify(body)
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error||'save failed');
    // update local
    const wk = currentCrop.weeks.find(w => w.week === currentWeek);
    Object.assign(wk, body);
    selectWeek(currentWeek);
    toast('บันทึกแล้ว');
  } catch(e) {
    toast('บันทึกไม่สำเร็จ: '+e.message, true);
  }
}

document.getElementById('cropSel').addEventListener('change', e => loadCrop(e.target.value));
document.getElementById('provSel').addEventListener('change', () => { renderCropDropdown(); });
document.getElementById('todayBtn').addEventListener('click', () => {
  if (currentCrop && TODAY_WK <= 52) selectWeek(TODAY_WK);
});
document.getElementById('adminBtn').addEventListener('click', e => {
  isAdmin = !isAdmin;
  document.getElementById('editBtn').style.display = isAdmin ? 'inline-block' : 'none';
  e.target.textContent = isAdmin ? 'ออกจากแอดมิน' : 'โหมดแอดมิน';
  toast(isAdmin ? 'เข้าโหมดแอดมิน' : 'ออกจากโหมดแอดมิน');
});
document.getElementById('bcBtn').addEventListener('click', broadcastWeek);
document.getElementById('editBtn').addEventListener('click', () => {
  document.getElementById('editArea').classList.toggle('show');
});
document.getElementById('editBtn').style.display = 'none';

loadCropsList();
</script>
<script src="/access-bar.js"></script>
</body>
</html>
