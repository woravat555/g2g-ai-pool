<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2G Farmer Weekly Advisory — แจ้งงานเกษตรกร</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Sarabun','Noto Sans Thai',-apple-system,sans-serif;background:linear-gradient(135deg,#1a2a3d 0%,#0d1928 50%,#0a1220 100%);color:#e8eef5;min-height:100vh;padding:14px}
  .wrap{max-width:1100px;margin:0 auto}
  header{background:rgba(0,0,0,.4);backdrop-filter:blur(14px);border-radius:18px;padding:20px 24px;margin-bottom:16px;border:1px solid rgba(102,178,255,.2)}
  h1{font-size:24px;font-weight:800;background:linear-gradient(135deg,#66b2ff,#3380cc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
  .subtitle{font-size:14px;color:#9bc5e3;opacity:.85}
  .meta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:13px}
  .badge{background:rgba(102,178,255,.15);color:#9bc5e3;padding:5px 12px;border-radius:20px;font-weight:600}
  .badge.today{background:linear-gradient(135deg,#ff9933,#cc6600);color:#fff}
  .controls{background:rgba(0,0,0,.3);border:1px solid rgba(102,178,255,.2);border-radius:14px;padding:16px;margin-bottom:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
  .controls label{display:block;font-size:12px;color:#9bc5e3;margin-bottom:4px}
  .controls select,.controls input{width:100%;background:rgba(255,255,255,.08);color:#e8eef5;border:1px solid rgba(102,178,255,.25);padding:10px 12px;border-radius:8px;font-size:14px;font-family:inherit}
  .controls select:focus,.controls input:focus{outline:none;border-color:#66b2ff}
  .layout{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  .panel{background:rgba(0,0,0,.35);border:1px solid rgba(102,178,255,.2);border-radius:14px;padding:18px}
  .panel h2{font-size:16px;color:#9bc5e3;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
  .panel h2 .cnt{background:rgba(102,178,255,.18);color:#66b2ff;font-size:11px;padding:3px 10px;border-radius:12px;font-weight:700}
  .crop-card{background:rgba(255,255,255,.06);border:1px solid rgba(102,178,255,.1);border-left:4px solid #66b2ff;border-radius:8px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:.15s}
  .crop-card:hover{background:rgba(102,178,255,.1);transform:translateX(2px)}
  .crop-card.selected{background:rgba(102,178,255,.15);border-left-color:#ffcc33}
  .crop-card .cn{font-size:15px;font-weight:700;color:#fff;margin-bottom:3px}
  .crop-card .ph{font-size:12px;color:#9bc5e3;margin-bottom:6px}
  .crop-card .tasks{font-size:12px;color:#c9d8e8;line-height:1.5}
  .crop-card .tasks li{margin-left:14px;padding:2px 0}
  .preview{background:rgba(0,0,0,.4);border-radius:10px;padding:14px;border:1px dashed rgba(102,178,255,.3);font-family:'SF Mono','Courier New',monospace;font-size:13px;color:#c9d8e8;line-height:1.6;white-space:pre-wrap;max-height:400px;overflow-y:auto}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .btn{flex:1;min-width:130px;background:linear-gradient(135deg,#66b2ff,#3380cc);color:#fff;border:none;padding:12px 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(102,178,255,.4)}
  .btn.send{background:linear-gradient(135deg,#33cc66,#1a8c44)}
  .btn.send:hover{box-shadow:0 4px 14px rgba(51,204,102,.4)}
  .btn.refresh{background:rgba(255,255,255,.08);border:1px solid rgba(102,178,255,.3)}
  .stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .stat-box{background:rgba(102,178,255,.08);border:1px solid rgba(102,178,255,.2);border-radius:10px;padding:12px;text-align:center}
  .stat-box .v{font-size:22px;font-weight:800;color:#66b2ff}
  .stat-box .l{font-size:11px;color:#9bc5e3;margin-top:2px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#33cc66,#1a8c44);color:#fff;padding:12px 24px;border-radius:30px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:9999;opacity:0;transition:.3s;font-size:14px}
  .toast.show{opacity:1;bottom:30px}
  .toast.err{background:linear-gradient(135deg,#ff4444,#cc0000)}
  .loading{text-align:center;padding:40px;color:#9bc5e3}
  .checkbox-list{max-height:300px;overflow-y:auto;background:rgba(0,0,0,.2);padding:10px;border-radius:8px;margin-bottom:10px}
  .checkbox-list label{display:flex;align-items:center;gap:8px;padding:6px;font-size:13px;cursor:pointer;border-radius:4px}
  .checkbox-list label:hover{background:rgba(102,178,255,.1)}
  .checkbox-list input[type=checkbox]{width:auto;accent-color:#66b2ff}
  .quick-pick{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .quick-pick button{background:rgba(102,178,255,.15);color:#9bc5e3;border:1px solid rgba(102,178,255,.25);padding:4px 10px;border-radius:14px;font-size:11px;cursor:pointer}
  .quick-pick button:hover{background:rgba(102,178,255,.25)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Farmer Weekly Advisory</h1>
    <div class="subtitle">ระบบแจ้งงานรายสัปดาห์เกษตรกร — G2G AgriTech</div>
    <div class="meta-row">
      <span class="badge today">วันนี้ — สัปดาห์ที่ <span id="todayWk">-</span></span>
      <span class="badge" id="dateLbl">-</span>
      <span class="badge" id="cropCount">- พืช</span>
    </div>
  </header>

  <div class="controls">
    <div>
      <label>จังหวัด</label>
      <select id="provSel">
        <option value="phrae">แพร่ (@phrae555)</option>
        <option value="chiangrai">เชียงราย</option>
        <option value="udonthani">อุดรธานี</option>
      </select>
    </div>
    <div>
      <label>LINE OA</label>
      <select id="oaSel">
        <option value="phrae555">@phrae555 — แพร่</option>
        <option value="fruit-farmers">น้องผลไม้กลุ่ม</option>
        <option value="custom">กำหนดเอง</option>
      </select>
    </div>
    <div>
      <label>สัปดาห์</label>
      <select id="wkSel"></select>
    </div>
    <div>
      <label>โหลด</label>
      <button class="btn refresh" id="refreshBtn">รีเฟรช</button>
    </div>
  </div>

  <div class="stat" id="statRow">
    <div class="stat-box"><div class="v" id="sCrops">-</div><div class="l">พืชที่ต้องดูแล</div></div>
    <div class="stat-box"><div class="v" id="sTasks">-</div><div class="l">งานสัปดาห์นี้</div></div>
    <div class="stat-box"><div class="v" id="sWarns">-</div><div class="l">ข้อควรระวัง</div></div>
  </div>

  <div class="layout">
    <div class="panel">
      <h2>พืชที่จะแจ้งเตือน <span class="cnt" id="selCnt">0 รายการ</span></h2>
      <div class="quick-pick">
        <button onclick="toggleAll(true)">เลือกทั้งหมด</button>
        <button onclick="toggleAll(false)">ไม่เลือกเลย</button>
        <button onclick="selectByProv()">เฉพาะจังหวัด</button>
      </div>
      <div class="checkbox-list" id="cropChecks">
        <div class="loading">กำลังโหลด...</div>
      </div>
    </div>

    <div class="panel">
      <h2>ตัวอย่างข้อความ LINE</h2>
      <div class="preview" id="msgPreview">เลือกพืช เพื่อดูตัวอย่างข้อความ</div>
      <div class="actions">
        <button class="btn send" id="sendBtn">ส่ง Broadcast ทันที</button>
        <button class="btn" id="copyBtn">คัดลอกข้อความ</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
</div>

<script>
const API_BASE = window.location.origin;
const API_KEY = 'phrae2026';
let allCrops = [];
let advisoryCache = null;
let selectedCodes = new Set();

function getISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

const TODAY = new Date();
const TODAY_WK = getISOWeek(TODAY);
document.getElementById('todayWk').textContent = TODAY_WK;
document.getElementById('dateLbl').textContent = TODAY.toLocaleDateString('th-TH', {year:'numeric',month:'long',day:'numeric'});

// populate week dropdown
const wkSel = document.getElementById('wkSel');
for (let i=1; i<=52; i++){
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = `สัปดาห์ที่ ${i}` + (i===TODAY_WK?' (วันนี้)':'');
  if (i === TODAY_WK) opt.selected = true;
  wkSel.appendChild(opt);
}

function toast(msg, err=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err?' err':'');
  setTimeout(()=>t.classList.remove('show'), 2800);
}

async function loadAdvisory(){
  const wk = parseInt(wkSel.value || TODAY_WK);
  try {
    const r = await fetch(`${API_BASE}/api/farmer/advisory/current?week=${wk}`, { headers:{'x-api-key':API_KEY}});
    const data = await r.json();
    if (!data.ok) throw new Error(data.error||'load failed');
    advisoryCache = data;
    allCrops = data.crops;
    renderChecks();
    updateStats();
    renderPreview();
  } catch(e) {
    toast('โหลดไม่สำเร็จ: '+e.message, true);
    document.getElementById('cropChecks').innerHTML = `<div class="loading">โหลดไม่สำเร็จ: ${e.message}</div>`;
  }
}

function renderChecks(){
  const box = document.getElementById('cropChecks');
  box.innerHTML = '';
  document.getElementById('cropCount').textContent = `${allCrops.length} พืช`;
  if (!allCrops.length){
    box.innerHTML = '<div class="loading">ไม่มีพืชในระบบ</div>';
    return;
  }
  allCrops.forEach(c => {
    const lbl = document.createElement('label');
    const id = 'cb_'+c.crop_code;
    const wk = c.week_data || {};
    lbl.innerHTML = `<input type="checkbox" id="${id}" data-code="${c.crop_code}" ${selectedCodes.has(c.crop_code)?'checked':''}>
      <div>
        <strong>${c.crop_name_th}</strong> — <span style="color:#9bc5e3;font-size:11px">${wk.phase||''}</span><br>
        <span style="font-size:11px;color:#7090b0">${(c.growing_zones||[]).slice(0,3).join(', ')}</span>
      </div>`;
    box.appendChild(lbl);
    lbl.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) selectedCodes.add(c.crop_code);
      else selectedCodes.delete(c.crop_code);
      renderPreview();
      updateStats();
    });
  });
}

function updateStats(){
  const wk = parseInt(wkSel.value || TODAY_WK);
  document.getElementById('sCrops').textContent = selectedCodes.size;
  let tasks = 0, warns = 0;
  allCrops.forEach(c => {
    if (selectedCodes.has(c.crop_code)) {
      tasks += (c.week_data?.tasks||[]).length;
      warns += (c.week_data?.warnings||[]).length;
    }
  });
  document.getElementById('sTasks').textContent = tasks;
  document.getElementById('sWarns').textContent = warns;
  document.getElementById('selCnt').textContent = `${selectedCodes.size} รายการ`;
}

function composeMessage(){
  const wk = parseInt(wkSel.value || TODAY_WK);
  const prov = document.getElementById('provSel').selectedOptions[0].textContent;
  const date = TODAY.toLocaleDateString('th-TH', {month:'short',day:'numeric'});
  const sel = allCrops.filter(c => selectedCodes.has(c.crop_code));
  if (!sel.length) return '— โปรดเลือกอย่างน้อย 1 พืช —';
  let msg = `🌾 งานเกษตรสัปดาห์ที่ ${wk}\n📅 ${date} | ${prov}\n\n`;
  sel.forEach(c => {
    const w = c.week_data || {};
    msg += `${c.icon||'🌱'} ${c.crop_name_th} — ${w.phase||''}\n`;
    (w.tasks||[]).forEach(t => msg += `• ${t}\n`);
    if (w.warnings?.length) msg += `⚠ ${w.warnings.join(' / ')}\n`;
    msg += '\n';
  });
  msg += '📍 ปัญหา/สอบถาม ตอบในกลุ่ม\n— G2G AgriTech';
  return msg;
}

function renderPreview(){
  document.getElementById('msgPreview').textContent = composeMessage();
}

function toggleAll(on){
  if (on) allCrops.forEach(c => selectedCodes.add(c.crop_code));
  else selectedCodes.clear();
  renderChecks();
  renderPreview();
  updateStats();
}

function selectByProv(){
  const prov = document.getElementById('provSel').value;
  const provMap = { phrae:'แพร่', chiangrai:'เชียงราย', udonthani:'อุดรธานี' };
  selectedCodes.clear();
  allCrops.forEach(c => {
    if ((c.growing_zones||[]).some(z => z.includes(provMap[prov]))) selectedCodes.add(c.crop_code);
  });
  renderChecks();
  renderPreview();
  updateStats();
}

async function sendBroadcast(){
  if (!selectedCodes.size) return toast('โปรดเลือกอย่างน้อย 1 พืช', true);
  const msg = composeMessage();
  if (!confirm(`ยืนยันส่ง LINE Broadcast ไปยัง ${document.getElementById('oaSel').selectedOptions[0].textContent}\n\nความยาว: ${msg.length} ตัวอักษร`)) return;
  try {
    const r = await fetch(`${API_BASE}/api/farmer/broadcast`, {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':API_KEY},
      body: JSON.stringify({
        province: document.getElementById('provSel').value,
        oa: document.getElementById('oaSel').value,
        week: parseInt(wkSel.value),
        crops: Array.from(selectedCodes),
        message: msg
      })
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error||'broadcast failed');
    toast(`ส่งสำเร็จ! (${data.target||'logged'}) — ${data.recipients||0} คน`);
  } catch(e) {
    toast('ส่งไม่สำเร็จ: '+e.message, true);
  }
}

function copyMsg(){
  navigator.clipboard.writeText(composeMessage()).then(()=>toast('คัดลอกแล้ว')).catch(()=>toast('คัดลอกไม่ได้', true));
}

document.getElementById('refreshBtn').addEventListener('click', loadAdvisory);
document.getElementById('wkSel').addEventListener('change', loadAdvisory);
document.getElementById('provSel').addEventListener('change', renderPreview);
document.getElementById('oaSel').addEventListener('change', renderPreview);
document.getElementById('sendBtn').addEventListener('click', sendBroadcast);
document.getElementById('copyBtn').addEventListener('click', copyMsg);

loadAdvisory();
</script>
<script src="/access-bar.js"></script>
</body>
</html>
