<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบบริหารจัดการ — หน่วยงาน</title>
  <style>
    :root {
      --primary: #1a4fa0;
      --primary-light: #f0f4fb;
      --primary-dark: #133580;
      --bg: #f0f4f8;
      --card: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 2px 8px rgba(26,79,160,0.10);
      --radius: 10px;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sarabun', 'Noto Sans Thai', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }

    /* ─── Login Screen ─────────────────── */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
    }
    .login-box {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    .login-logo {
      text-align: center;
      font-size: 56px;
      margin-bottom: 8px;
    }
    .login-title {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .login-subtitle {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--text); }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: #fafafa;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
    }
    .checkbox-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .checkbox-row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--primary); }
    .checkbox-row label { font-size: 14px; margin: 0; }

    /* ─── Header ─────────────────────── */
    #app-screen { display: none; }
    .header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
      color: #fff;
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 28px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    .header-logo {
      width: 56px;
      height: 56px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }
    .header-titles { flex: 1; }
    .header-ministry { font-size: 11px; opacity: 0.80; letter-spacing: 0.5px; }
    .header-agency { font-size: 20px; font-weight: 700; line-height: 1.2; }
    .header-user { font-size: 13px; opacity: 0.85; margin-top: 2px; }
    .header-actions { display: flex; gap: 8px; flex-shrink: 0; }

    /* ─── Buttons ─────────────────────── */
    .btn {
      padding: 8px 18px;
      border-radius: 7px;
      border: none;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    .btn:hover:not(:disabled) { opacity: 0.85; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .btn-outline-white { background: transparent; border: 1.5px solid rgba(255,255,255,0.6); color: #fff; }
    .btn-white { background: #fff; color: var(--primary); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { padding: 5px 12px; font-size: 12px; }
    .btn-full { width: 100%; padding: 13px; font-size: 16px; }

    /* ─── Nav Tabs ─────────────────────── */
    .nav-tabs {
      display: flex;
      gap: 3px;
      padding: 10px 28px 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .nav-tab {
      padding: 9px 18px;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.75);
      background: rgba(255,255,255,0.08);
      border: none;
      font-family: inherit;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .nav-tab:hover { background: rgba(255,255,255,0.15); color: #fff; }
    .nav-tab.active { background: var(--bg); color: var(--primary); font-weight: 700; }

    /* ─── Main Content ─────────────────── */
    .main-content { padding: 24px 28px; max-width: 1200px; }

    /* ─── KPI Cards ─────────────────────── */
    .kpi-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .kpi-card {
      flex: 1;
      min-width: 160px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--primary);
    }
    .kpi-label { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
    .kpi-value { font-size: 28px; font-weight: 700; color: var(--primary); }
    .kpi-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

    /* ─── Cards ─────────────────────────── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .card-title { font-size: 15px; font-weight: 700; }
    .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    @media (max-width: 700px) { .section-grid { grid-template-columns: 1fr; } }

    /* ─── Tables ─────────────────────────── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th { background: var(--primary-light); color: var(--primary); font-weight: 700; padding: 10px 12px; text-align: left; border-bottom: 2px solid var(--border); }
    td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--primary-light); }

    /* ─── Progress bar ─────────────────── */
    .progress-bar { background: var(--border); border-radius: 99px; height: 8px; overflow: hidden; min-width: 80px; }
    .progress-fill { height: 100%; border-radius: 99px; background: var(--primary); transition: width 0.4s; }

    /* ─── Status badges ─────────────────── */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge-success { background: #dcfce7; color: #16a34a; }
    .badge-warning { background: #fef9c3; color: #b45309; }
    .badge-danger { background: #fee2e2; color: #dc2626; }
    .badge-muted { background: var(--border); color: var(--text-muted); }

    /* ─── Quick Actions ─────────────────── */
    .quick-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }

    /* ─── Modal ──────────────────────────── */
    .modal-bg {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 14px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    }
    .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 20px; color: var(--primary); }
    .modal-actions { display: flex; gap: 10px; margin-top: 24px; justify-content: flex-end; }

    /* ─── Chat ──────────────────────────── */
    .chat-area {
      background: var(--primary-light);
      border-radius: var(--radius);
      padding: 16px;
      min-height: 260px;
      max-height: 380px;
      overflow-y: auto;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      max-width: 82%;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .chat-bubble.user { background: var(--primary); color: #fff; align-self: flex-end; border-radius: 12px 12px 4px 12px; }
    .chat-bubble.ai { background: #fff; color: var(--text); align-self: flex-start; border-radius: 12px 12px 12px 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .chat-input-row { display: flex; gap: 8px; }
    .chat-input-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    .chat-input-row input:focus { outline: none; border-color: var(--primary); }

    /* ─── Floating AI Button ─────────────── */
    #float-ai {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 900;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 26px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s;
    }
    #float-ai:hover { transform: scale(1.08); }

    /* ─── Float chat panel ─────────────── */
    #float-chat-panel {
      display: none;
      position: fixed;
      bottom: 96px;
      right: 28px;
      z-index: 901;
      width: 340px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.2);
      padding: 20px;
    }
    #float-chat-panel.open { display: block; }
    .float-chat-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: var(--primary); }

    /* ─── AI slots ─────────────────────── */
    .slots-bar { background: var(--border); border-radius: 99px; height: 12px; margin: 8px 0 4px; }
    .slots-fill { height: 100%; border-radius: 99px; background: var(--primary); }

    /* ─── Alert ─────────────────────────── */
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .alert.show { display: block; }
    .alert-success { background: #dcfce7; color: #16a34a; border-left: 4px solid #16a34a; }
    .alert-error { background: #fee2e2; color: #dc2626; border-left: 4px solid #dc2626; }

    .text-muted { color: var(--text-muted); }
    .mt-4 { margin-top: 16px; }
    .mb-2 { margin-bottom: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- ─── LOGIN SCREEN ──────────────────────────── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo" id="login-logo">🏛️</div>
    <div class="login-title" id="login-title">ระบบบริหารจัดการ</div>

      <input type="checkbox" id="chk-ai" />

    </div>
    <button class="btn btn-primary btn-full" onclick="doLogin()">เข้าสู่ระบบ</button>
  </div>
</div>

<!-- ─── APP SCREEN ──────────────────────────── -->
<div id="app-screen">
  <div class="header">
    <div class="header-top">
      <div class="header-logo" id="app-logo">🏛️</div>
      <div class="header-titles">
        <div class="header-ministry" id="app-ministry">หน่วยงานรัฐ</div>

<script>
// ─── State ──────────────────────────────────────────────────────────────
const urlParams = new URLSearchParams(window.location.search);
const agencyId = urlParams.get('agency') || 'nstda';

let currentUser = null;
let agencyConfig = null;
let currentPage = 'overview';
let hasPersonalAI = false;
let aiUnlocked = false;

// ─── Mock Data ───────────────────────────────────────────────────────────
const MOCK_CONFIG = {
  nstda:    { name:'สำนักงานพัฒนาวิทยาศาสตร์และเทคโนโลยีแห่งชาติ', shortName:'สวทช.', icon:'🔬', theme:'#1a4fa0', themeLight:'#f0f4fb', ministry:'กระทรวงการอุดมศึกษาฯ', reportTo:'กระทรวงการอุดมศึกษา วิทยาศาสตร์ วิจัยและนวัตกรรม', modules:['overview','personnel','projects','budget','line-ai','settings'] },
  chula:    { name:'จุฬาลงกรณ์มหาวิทยาลัย', shortName:'จุฬาฯ', icon:'🎓', theme:'#7c1c1c', themeLight:'#fdf2f2', ministry:'กระทรวงการอุดมศึกษาฯ', reportTo:'สำนักงาน กกอ.', modules:['overview','personnel','projects','budget','line-ai','settings'] },
  'rid-phrae': { name:'สำนักชลประทานที่ 4 จ.แพร่', shortName:'ชป.แพร่', icon:'💧', theme:'#0e7490', themeLight:'#ecfeff', ministry:'กระทรวงเกษตรและสหกรณ์', reportTo:'กรมชลประทาน', modules:['overview','personnel','projects','budget','settings'] },
};

const MOCK_SUMMARY = {

// ─── Init ─────────────────────────────────────────────────────────────────
async function init() {
  const cfg = MOCK_CONFIG[agencyId] || MOCK_CONFIG['nstda'];
  agencyConfig = cfg;
  applyTheme(cfg);

  document.getElementById('login-logo').textContent = cfg.icon;
  document.getElementById('login-title').textContent = cfg.shortName + ' — ระบบบริหารจัดการ';
  document.getElementById('login-subtitle').textContent = cfg.ministry;

  // Check if AI module available
  if (!cfg.modules.includes('line-ai')) {
    document.getElementById('tab-ai').classList.add('hidden');
  }

  loadSavedCustomizations(agencyId);

  try {
    const res = await fetch('/api/subagency/config/' + agencyId);
    if (res.ok) {
      const data = await res.json();
      agencyConfig = data;
      applyTheme(data);
      document.getElementById('login-logo').textContent = data.icon;
      document.getElementById('login-title').textContent = data.shortName + ' — ระบบบริหารจัดการ';
      document.getElementById('login-subtitle').textContent = data.ministry;
    }
  } catch(e) { /* use mock */ }
}

function applyTheme(cfg) {
  document.documentElement.style.setProperty('--primary', cfg.theme);
  document.documentElement.style.setProperty('--primary-light', cfg.themeLight || '#f0f4fb');
  document.documentElement.style.setProperty('--primary-dark', shadeColor(cfg.theme, -20));
  document.title = (cfg.shortName || cfg.name) + ' — ระบบบริหารจัดการ';
}

function shadeColor(color, percent) {
  try {
    let R = parseInt(color.slice(1,3),16);
    let G = parseInt(color.slice(3,5),16);
    let B = parseInt(color.slice(5,7),16);
    R = Math.min(255, Math.max(0, R + percent));
    G = Math.min(255, Math.max(0, G + percent));
    B = Math.min(255, Math.max(0, B + percent));
    return '#' + [R,G,B].map(v=>v.toString(16).padStart(2,'0')).join('');
  } catch(e) { return color; }
}

function loadSavedCustomizations(aid) {
  const saved = localStorage.getItem('platform-config-' + aid);
  if (!saved) return;
  try {
    const changes = JSON.parse(saved);
    if (changes.cssVars) Object.entries(changes.cssVars).forEach(function(entry) { document.documentElement.style.setProperty(entry[0], entry[1]); });
    if (changes.title) {
      const el = document.getElementById('agency-title');
      if (el) el.textContent = changes.title;
    }
  } catch(e) {}
}

async function doLogin() {
  const empid = document.getElementById('inp-empid').value.trim();
  const name = document.getElementById('inp-name').value.trim();
  const position = document.getElementById('inp-position').value;
  const dept = document.getElementById('inp-dept').value;
  const wantsAI = document.getElementById('chk-ai').checked;
  const alertEl = document.getElementById('login-alert');

  if (!empid || !name || !position || !dept) {
    alertEl.textContent = 'กรุณากรอกข้อมูลให้ครบถ้วน';
    alertEl.classList.add('show','alert-error');
    return;
  }
  alertEl.classList.remove('show');

  currentUser = { empid, name, position, dept, wantsAI };

  try {
    await fetch('/api/subagency/' + agencyId + '/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},

    });
  } catch(e) {}

  if (wantsAI) {

function showApp() {

  loadPage('overview');
}

// ─── Navigation ───────────────────────────────────────────────────────────
function loadPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-tab').forEach(function(t) { t.classList.remove('active'); });
  const tabs = document.querySelectorAll('.nav-tab');
  const pageToIdx = {overview:0, personnel:1, projects:2, budget:3, 'personal-ai':4, settings:5};
  const idx = pageToIdx[page];
  if (tabs[idx]) tabs[idx].classList.add('active');

  const mc = document.getElementById('main-content');
  if (page === 'overview') mc.innerHTML = buildOverview();
  else if (page === 'personnel') { mc.innerHTML = buildPersonnel(); }
  else if (page === 'projects') { mc.innerHTML = buildProjects(); }
  else if (page === 'budget') { mc.innerHTML = buildBudget(); }
  else if (page === 'personal-ai') { mc.innerHTML = buildPersonalAI(); }
  else if (page === 'settings') { mc.innerHTML = buildSettings(); }
}

    h += "<div class='card-header'><span class='card-title'>💬 AI ส่วนตัวของคุณ</span><button class='btn btn-outline btn-sm' onclick='saveAIMemory()'>💾 จำเรื่องนี้</button></div>";
    h += "<div class='chat-area' id='ai-chat-area'>";
    CHAT_HISTORY.forEach(function(msg) {
      h += "<div class='chat-bubble " + msg.role + "'>" + escHtml(msg.content) + "</div>";
    });
    if (CHAT_HISTORY.length === 0) {
      h += "<div class='chat-bubble ai'>สวัสดีครับ ผมคือ AI ผู้ช่วยส่วนตัวของคุณ จะให้ช่วยอะไรวันนี้ครับ?</div>";
    }
    h += "</div>";
    h += "<div class='chat-input-row'>";
    h += "<input type='text' id='ai-chat-input' placeholder='พิมพ์ข้อความ...' onkeydown='if(event.key===\"Enter\")sendPersonalAIChat()' />";
    h += "<button class='btn btn-primary' onclick='sendPersonalAIChat()'>ส่ง</button>";
    h += "</div>";
    h += "</div>";
  }
  h += "</div>";
  return h;
}

async function registerPersonalAI() {
  const aiName = document.getElementById('ai-name').value.trim();
  const goal = document.getElementById('ai-goal').value.trim();
  const context = document.getElementById('ai-context').value.trim();
  const style = document.getElementById('ai-style').value;
  const storageKey = 'personal-ai-' + agencyId + '-' + (currentUser ? currentUser.empid : 'guest');

  try {
    await fetch('/api/personal-ai/register', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ agencyId, userId: currentUser ? currentUser.empid : 'demo', aiName, goal, context, style })
    });
  } catch(e) {}

  localStorage.setItem(storageKey, 'registered');
  localStorage.setItem(storageKey + '-config', JSON.stringify({ aiName, goal, context, style }));
  hasPersonalAI = true;
  MOCK_SUMMARY.aiSlots.used = Math.min(MOCK_SUMMARY.aiSlots.used + 1, MOCK_SUMMARY.aiSlots.total);
  CHAT_HISTORY = [];
  loadPage('personal-ai');
}

async function sendPersonalAIChat() {
  const input = document.getElementById('ai-chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';

  CHAT_HISTORY.push({ role:'user', content: msg });
  const area = document.getElementById('ai-chat-area');
  const userBubble = document.createElement('div');
  userBubble.className = 'chat-bubble user';
  userBubble.textContent = msg;
  area.appendChild(userBubble);
  area.scrollTop = area.scrollHeight;

  try {
    const r = await fetch('/api/personal-ai/' + (currentUser ? currentUser.empid : 'demo') + '/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ message: msg, agencyId })
    });
    if (r.ok) {
      const data = await r.json();
      const reply = data.reply || data.message || 'ขอบคุณครับ';
      CHAT_HISTORY.push({ role:'ai', content: reply });
      const aiBubble = document.createElement('div');
      aiBubble.className = 'chat-bubble ai';
      aiBubble.textContent = reply;
      area.appendChild(aiBubble);
      area.scrollTop = area.scrollHeight;
      return;
    }
  } catch(e) {}

  const mockReplies = ['เข้าใจแล้วครับ ผมจะช่วยดูเรื่องนี้ให้', 'ขอบคุณสำหรับข้อมูลครับ มีอะไรให้ช่วยเพิ่มเติมไหม?', 'ดูเหมือนเรื่องนี้น่าสนใจมากครับ ขอวิเคราะห์ให้สักครู่', 'ผมบันทึกไว้แล้วครับ จะนำมาใช้ในการแนะนำครั้งต่อไป'];
  const reply = mockReplies[Math.floor(Math.random() * mockReplies.length)];
  CHAT_HISTORY.push({ role:'ai', content: reply });
  const aiBubble = document.createElement('div');
  aiBubble.className = 'chat-bubble ai';
  aiBubble.textContent = reply;
  area.appendChild(aiBubble);
  area.scrollTop = area.scrollHeight;
}

async function saveAIMemory() {
  const key = prompt('ชื่อหัวข้อที่จะจำ:');
  const value = prompt('รายละเอียด:');
  if (!key || !value) return;
  try {
    await fetch('/api/personal-ai/' + (currentUser ? currentUser.empid : 'demo') + '/memory', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ key, value, agencyId })
    });
  } catch(e) {}
  alert('บันทึกความทรงจำ: "' + key + '" เรียบร้อยแล้ว');
}

async function verifyAdminCode() {
  const code = document.getElementById('admin-code').value.trim();
  if (code.length < 4) { showAlert('set-alert-err', 'กรุณากรอกรหัส', 'error'); return; }

  try {
    const r = await fetch('/api/admin/platform-code/verify', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ code, agencyId })
    });
    if (r.ok) {
      aiUnlocked = true;
      document.getElementById('customize-panel').style.display = 'block';
      showAlert('set-alert', 'ยืนยันรหัสสำเร็จ', 'success');
      return;
    }
  } catch(e) {}

  // Demo: accept any 8-char code
  if (code.length >= 4) {
    aiUnlocked = true;
    document.getElementById('customize-panel').style.display = 'block';
    showAlert('set-alert', 'ยืนยันรหัสสำเร็จ (Demo Mode)', 'success');
  }
}

async function sendCustomizeChat() {
  const input = document.getElementById('cust-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';

  const area = document.getElementById('cust-chat-area');
  const userBubble = document.createElement('div');
  userBubble.className = 'chat-bubble user';
  userBubble.textContent = msg;
  area.appendChild(userBubble);
  area.scrollTop = area.scrollHeight;

  let changes = null;
  try {
    const r = await fetch('/api/admin/platform-code/customize', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ message: msg, agencyId })
    });
    if (r.ok) changes = await r.json();
  } catch(e) {}

  if (!changes) {
    changes = parseCustomizeIntent(msg);
  }

  if (changes) {
    applyCustomizationChanges(changes);
    const savedKey = 'platform-config-' + agencyId;
    const existing = JSON.parse(localStorage.getItem(savedKey) || '{}');
    if (changes.cssVars) existing.cssVars = Object.assign(existing.cssVars || {}, changes.cssVars);
    if (changes.title) existing.title = changes.title;
    localStorage.setItem(savedKey, JSON.stringify(existing));
  }

  const reply = changes ? '✅ ปรับแต่งเรียบร้อยแล้วครับ! ' + (changes.message || '') : 'ขอโทษครับ ไม่เข้าใจคำสั่ง ลองบอกว่า "เปลี่ยนสีเป็น..." หรือ "เปลี่ยนชื่อเป็น..."';
  const aiBubble = document.createElement('div');
  aiBubble.className = 'chat-bubble ai';
  aiBubble.textContent = reply;
  area.appendChild(aiBubble);
  area.scrollTop = area.scrollHeight;
}

function parseCustomizeIntent(msg) {
  const lower = msg.toLowerCase();
  if (lower.includes('เขียว') || lower.includes('green')) return { cssVars: {'--primary':'#16a34a','--primary-dark':'#0d7a35','--primary-light':'#dcfce7'}, message:'เปลี่ยนสีเป็นเขียวแล้ว' };
  if (lower.includes('น้ำเงิน') || lower.includes('blue')) return { cssVars: {'--primary':'#1a4fa0','--primary-dark':'#133580','--primary-light':'#f0f4fb'}, message:'เปลี่ยนสีเป็นน้ำเงินแล้ว' };
  if (lower.includes('แดง') || lower.includes('red')) return { cssVars: {'--primary':'#dc2626','--primary-dark':'#b91c1c','--primary-light':'#fee2e2'}, message:'เปลี่ยนสีเป็นแดงแล้ว' };
  if (lower.includes('ม่วง') || lower.includes('purple')) return { cssVars: {'--primary':'#7c3aed','--primary-dark':'#5b21b6','--primary-light':'#f5f3ff'}, message:'เปลี่ยนสีเป็นม่วงแล้ว' };
  if (lower.includes('เปลี่ยนชื่อ') || lower.includes('ชื่อระบบ')) {
    const match = msg.match(/เป็น\s*(.+)/);
    if (match) return { title: match[1].trim(), message:'เปลี่ยนชื่อระบบแล้ว' };
  }
  return null;
}

function applyCustomizationChanges(changes) {
  if (changes.cssVars) {
    Object.entries(changes.cssVars).forEach(function(entry) {
      document.documentElement.style.setProperty(entry[0], entry[1]);
    });
  }
  if (changes.title) {
    const el = document.getElementById('agency-title');
    if (el) el.textContent = changes.title;
  }
}

function resetCustomizations() {
  localStorage.removeItem('platform-config-' + agencyId);
  location.reload();
}

// ─── Floating Chat ────────────────────────────────────────────────────────
function toggleFloatChat() {
  const panel = document.getElementById('float-chat-panel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) {
    const storageKey = 'personal-ai-' + agencyId + '-' + (currentUser ? currentUser.empid : 'guest');
    const isRegistered = localStorage.getItem(storageKey) === 'registered';
    const titleEl = document.getElementById('float-chat-title');
    if (isRegistered) titleEl.textContent = '🤖 AI ส่วนตัวของคุณ';
    else titleEl.textContent = '💬 AI ผู้ช่วยทั่วไป';
  }
}

async function sendFloatChat() {
  const input = document.getElementById('float-chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';

  const area = document.getElementById('float-chat-area');
  const userBubble = document.createElement('div');
  userBubble.className = 'chat-bubble user';
  userBubble.textContent = msg;
  area.appendChild(userBubble);
  area.scrollTop = area.scrollHeight;

  FLOAT_CHAT_HISTORY.push({ role:'user', content: msg });

  const storageKey = 'personal-ai-' + agencyId + '-' + (currentUser ? currentUser.empid : 'guest');
  const isRegistered = localStorage.getItem(storageKey) === 'registered';
  const endpoint = isRegistered
    ? '/api/personal-ai/' + (currentUser ? currentUser.empid : 'demo') + '/chat'
    : '/api/management/chat';

  let reply = null;
  try {
    const r = await fetch(endpoint, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ message: msg, agencyId })
    });
    if (r.ok) {
      const data = await r.json();
      reply = data.reply || data.message;
    }
  } catch(e) {}

  if (!reply) {
    const mockReplies = ['เข้าใจแล้วครับ จะช่วยดูเรื่องนี้ให้', 'ขอบคุณสำหรับข้อมูลครับ', 'ผมพร้อมช่วยเสมอครับ มีอะไรเพิ่มเติมไหม?', 'บันทึกไว้แล้วครับ'];
    reply = mockReplies[Math.floor(Math.random() * mockReplies.length)];
  }

  FLOAT_CHAT_HISTORY.push({ role:'ai', content: reply });
  const aiBubble = document.createElement('div');
  aiBubble.className = 'chat-bubble ai';
  aiBubble.textContent = reply;
  area.appendChild(aiBubble);
  area.scrollTop = area.scrollHeight;
}

// ─── Modals ───────────────────────────────────────────────────────────────
function openModal(id) {
  document.getElementById(id).classList.add('open');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

document.addEventListener('click', function(e) {
  if (e.target.classList.contains('modal-bg')) {
    e.target.classList.remove('open');
  }
});

// ─── Helpers ──────────────────────────────────────────────────────────────
function showAlert(id, msg, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.className = 'alert show alert-' + type;
  setTimeout(function() { el.classList.remove('show'); }, 4000);
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
