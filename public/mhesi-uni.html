<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>แพลตฟอร์มบริหารสถาบันอุดมศึกษา อว.</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p1:#1a237e;--p2:#283593;--p3:#3949ab;--p4:#c5cae9;--p5:#e8eaf6;--gray:#f8f9fa;--border:#e0e0e0;--sub:#666}
body{font-family:'Sarabun',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* ---- PICKER SCREEN ---- */
#picker{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a237e 0%,#3949ab 50%,#7986cb 100%)}
.pk{background:#fff;border-radius:20px;padding:40px;width:min(560px,96vw);box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.pk h1{font-size:20px;font-weight:700;color:var(--p1);margin-bottom:4px}
.pk p{font-size:12px;color:var(--sub);margin-bottom:20px}
.pk-search{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:'Sarabun',sans-serif;outline:none;margin-bottom:12px}
.pk-search:focus{border-color:var(--p1)}
.pk-list{max-height:320px;overflow-y:auto;text-align:left;border:1px solid var(--border);border-radius:10px}
.pk-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px;transition:.1s;display:flex;align-items:center;gap:10px}
.pk-item:last-child{border-bottom:none}
.pk-item:hover{background:var(--p5)}
.pk-abbr{font-weight:700;color:var(--p1);min-width:60px}
.pk-info{flex:1}
.pk-name{font-weight:600;font-size:13px}
.pk-prov{font-size:11px;color:var(--sub)}
.pk-type-badge{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600}
.t-auto{background:#dbeafe;color:#1e40af}
.t-state{background:#dcfce7;color:#166534}
.t-rajabhat{background:#f3e8ff;color:#6b21a8}
.t-rajamangala{background:#fff7ed;color:#c2410c}
.t-private{background:#fef9c3;color:#854d0e}

/* ---- LOGIN SCREEN ---- */
#login{display:none;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#111 0%,var(--p2) 60%,var(--p3) 100%)}
.lc{background:#fff;border-radius:20px;padding:40px;width:min(520px,96vw);box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.lc-badge{width:76px;height:76px;background:linear-gradient(135deg,var(--p1),var(--p3));border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:32px;color:#fff;margin-bottom:12px}
.lc h1{font-size:20px;font-weight:700;color:var(--p1)}
.lc p{font-size:12px;color:var(--sub);margin-top:4px}
.role-box{margin:20px 0;padding:18px;background:var(--p5);border-radius:14px;border:2px solid var(--p4)}
.rb-emoji{font-size:38px;margin-bottom:8px}.rb-name{font-size:17px;font-weight:700;color:var(--p1)}
.rb-sub{font-size:12px;color:var(--sub);margin-top:4px}
.lc-roles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 0}
.role-btn{padding:12px 8px;border:2px solid var(--border);border-radius:10px;cursor:pointer;text-align:center;font-family:'Sarabun',sans-serif;font-size:12px;font-weight:600;background:#fff;transition:.15s;color:var(--sub)}
.role-btn:hover,.role-btn.sel{border-color:var(--p1);background:var(--p5);color:var(--p1)}
.role-btn .re{font-size:20px;display:block;margin-bottom:4px}
.lc-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--p1),var(--p3));color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Sarabun',sans-serif;margin-top:8px}
.lc-back{width:100%;padding:10px;background:none;color:var(--sub);border:1px solid var(--border);border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif;margin-top:8px}

/* ---- APP LAYOUT ---- */
#app{display:none;flex-direction:column;height:100vh}
.topbar{background:linear-gradient(90deg,var(--p1),var(--p2));color:#fff;padding:0 20px;height:56px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.tb-b{width:38px;height:38px;background:rgba(255,255,255,.2);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px}
.tb-title{font-size:15px;font-weight:700;flex:1}
.tb-stats{display:flex;gap:10px;font-size:11px}
.tb-stat{background:rgba(255,255,255,.15);padding:4px 10px;border-radius:12px}
.tb-lo{background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:11px;font-family:'Sarabun',sans-serif}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:210px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sb-section{padding:8px 14px;font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-top:8px}
.nav-item{padding:10px 16px;cursor:pointer;border-left:3px solid transparent;font-size:12px;color:var(--sub);transition:.15s;display:flex;align-items:center;gap:7px}
.nav-item:hover,.nav-item.active{background:var(--p5);color:var(--p1)}
.nav-item.active{border-left-color:var(--p1);font-weight:600}
.content{flex:1;overflow-y:auto;padding:20px;background:var(--gray)}
.tab-pane{display:none}.tab-pane.active{display:block}
.page-title{font-size:20px;font-weight:700;color:var(--p1);margin-bottom:4px}
.page-sub{font-size:12px;color:var(--sub);margin-bottom:16px}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.kpi-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.kpi{background:#fff;border-radius:12px;padding:16px;border-top:4px solid var(--p1);text-align:center}
.kpi-v{font-size:22px;font-weight:700;color:var(--p1)}.kpi-l{font-size:11px;color:var(--sub);margin-top:2px}
.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:700;color:var(--p1);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--p4);display:flex;align-items:center;gap:6px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--p1);color:#fff;padding:9px 10px;text-align:left;font-weight:600}
td{padding:8px 10px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--p5)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.bg{background:#dcfce7;color:#166534}.by{background:#fef9c3;color:#854d0e}
.bb{background:#dbeafe;color:#1e40af}.br{background:#fee2e2;color:#991b1b}.bp{background:#f3e8ff;color:#6b21a8}
.alert-box{background:#fff7ed;border:1px solid #fed7aa;border-left:4px solid #f97316;border-radius:8px;padding:12px 15px;margin-bottom:10px}
.alert-title{font-size:13px;font-weight:700;color:#c2410c}.alert-sub{font-size:11px;color:#9a3412;margin-top:2px}
.policy-card{background:#fff;border-radius:10px;padding:14px;margin-bottom:10px;border-left:4px solid var(--p1)}
.pc-title{font-size:13px;font-weight:700;color:var(--p1)}.pc-sub{font-size:11px;color:var(--sub);margin-top:3px}
.progress{background:#f3f4f6;border-radius:8px;height:8px;margin-top:8px}
.progress-bar{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--p1),var(--p3))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:600;color:var(--p1);margin-bottom:5px;display:block}
.form-input,.form-select,.form-textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:'Sarabun',sans-serif;outline:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--p1)}
.form-textarea{resize:vertical;min-height:80px}
.form-btn{padding:10px 22px;background:linear-gradient(135deg,var(--p1),var(--p3));color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Sarabun',sans-serif}
.task-card{background:#fff;border-radius:10px;padding:14px;margin-bottom:10px;border-left:4px solid var(--p1);display:flex;align-items:flex-start;gap:12px}
.task-body{flex:1}
.task-title{font-size:13px;font-weight:700;color:var(--p1)}.task-sub{font-size:11px;color:var(--sub);margin-top:3px}
.task-meta{display:flex;gap:8px;margin-top:6px;align-items:center}
</style></head><body>

<!-- ===================== PICKER SCREEN ===================== -->
<div id="picker">
  <div class="pk">
    <div style="font-size:40px;margin-bottom:8px">🏛️</div>
    <h1>แพลตฟอร์มบริหารสถาบันอุดมศึกษา</h1>
    <p>กระทรวงการอุดมศึกษา วิทยาศาสตร์ วิจัยและนวัตกรรม (อว.)</p>
    <input type="text" class="pk-search" id="pkSearch" placeholder="ค้นหาสถาบัน... (ชื่อ, ชื่อย่อ, จังหวัด)" oninput="filterUnis()">
    <div class="pk-list" id="pkList"></div>
  </div>
</div>

<!-- ===================== LOGIN SCREEN ===================== -->
<div id="login">
  <div class="lc">
    <div><div class="lc-badge" id="loginEmoji">🏛️</div>
    <h1 id="loginTitle">มหาวิทยาลัย</h1>
    <p id="loginSub">สถาบันอุดมศึกษา ในสังกัด อว.</p></div>
    <div class="role-box">
      <div style="font-size:12px;font-weight:700;color:var(--p1);margin-bottom:12px">เลือกบทบาทของคุณ</div>
      <div class="lc-roles">
        <div class="role-btn sel" id="rb-rector" onclick="selectRole('rector')"><span class="re">🎓</span>อธิการบดี</div>
        <div class="role-btn" id="rb-deputy" onclick="selectRole('deputy')"><span class="re">📋</span>รองอธิการบดี</div>
        <div class="role-btn" id="rb-staff" onclick="selectRole('staff')"><span class="re">👤</span>เจ้าหน้าที่</div>
      </div>
      <div class="rb-sub" id="roleSub">ภาพรวมมหาวิทยาลัย · งบประมาณ · บุคลากร · วิจัย · คุณภาพ</div>
    </div>
    <button class="lc-btn" onclick="doLogin()">🔐 เข้าสู่ระบบ</button>
    <button class="lc-back" onclick="goBack()">← เลือกสถาบันอื่น</button>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
<div class="topbar" id="topbar">
  <div class="tb-b" id="tbEmoji">🏛️</div>
  <div class="tb-title" id="tbTitle">แพลตฟอร์มบริหารมหาวิทยาลัย</div>
  <div class="tb-stats" id="tbStats"></div>
  <button class="tb-lo" onclick="doLogout()">ออกระบบ</button>
</div>
<div class="main">
<div class="sidebar" id="sidebar"></div>
<div class="content" id="content"></div>
</div>
</div>

const TYPE_LABEL = {auto:'ม.ในกำกับรัฐ', state:'ม.รัฐ', rajabhat:'ม.ราชภัฏ', rajamangala:'มทร.', private:'ม.เอกชน'};

// ===================== STATE =====================
let currentUni = null;
let currentRole = 'rector';
const params = new URLSearchParams(window.location.search);
const uniParam = params.get('uni');
const roleParam = params.get('role');

// ===================== INIT =====================
function init() {
  if (uniParam && UNI_DB[uniParam]) {
    currentUni = uniParam;
    if (roleParam && ['rector','deputy','staff'].includes(roleParam)) {
      currentRole = roleParam;
      showLogin(true); // skip role picker, go straight to login
    } else {
      showLogin(false);
    }
  } else {
    showPicker();
  }
}

function showPicker() {
  document.getElementById('picker').style.display = 'flex';
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'none';
  renderPickerList('');
}

function filterUnis() {
  const q = document.getElementById('pkSearch').value;
  renderPickerList(q);
}

function renderPickerList(q) {
  const list = document.getElementById('pkList');
  const lower = q.toLowerCase();
  const entries = Object.entries(UNI_DB).filter(([slug, u]) => {
    if (!q) return true;
    return u.name.includes(q) || u.abbr.includes(q) || u.province.includes(q) ||
           u.nameEn.toLowerCase().includes(lower) || slug.toLowerCase().includes(lower);
  });
  if (!entries.length) { list.innerHTML = '<div style="padding:16px;text-align:center;color:var(--sub);font-size:13px">ไม่พบสถาบัน</div>'; return; }
  list.innerHTML = entries.map(([slug, u]) =>
    `<div class="pk-item" onclick="selectUni('${slug}')">
      <div class="pk-abbr">${u.abbr}</div>
      <div class="pk-info">
        <div class="pk-name">${u.name}</div>
        <div class="pk-prov">จ.${u.province} · ${u.focus}</div>
      </div>
      <span class="pk-type-badge t-${u.type}">${TYPE_LABEL[u.type]||u.type}</span>
    </div>`
  ).join('');
}

function selectUni(slug) {
  currentUni = slug;
  currentRole = 'rector';
  showLogin(false);
}

function showLogin(autoLogin) {
  const u = UNI_DB[currentUni];
  applyColors(u.p1);
  document.getElementById('picker').style.display = 'none';
  document.getElementById('app').style.display = 'none';
  const loginEl = document.getElementById('login');
  loginEl.style.display = 'flex';
  loginEl.style.background = `linear-gradient(135deg, ${darken(u.p1,40)} 0%, ${u.p1} 60%, ${lighten(u.p1,30)} 100%)`;
  document.getElementById('loginEmoji').textContent = uniEmoji(u.type);
  document.getElementById('loginTitle').textContent = u.name;
  document.getElementById('loginSub').textContent = u.nameEn + ' · จ.' + u.province + ' · ' + TYPE_LABEL[u.type];
  selectRole(currentRole);
  if (autoLogin) doLogin();
}

function selectRole(role) {
  currentRole = role;
  ['rector','deputy','staff'].forEach(r => {
    document.getElementById('rb-'+r).classList.toggle('sel', r === role);
  });
  const subs = {
    rector: 'ภาพรวมมหาวิทยาลัย · งบประมาณ · บุคลากร · วิจัย · คุณภาพ · รายงาน อว.',
    deputy: 'งานที่ได้รับมอบหมาย · ควบคุมงาน · รายงานขึ้นอธิการบดี',
    staff: 'งานของฉัน · รายงานขึ้นรองอธิการบดี'
  };
  document.getElementById('roleSub').textContent = subs[role];
}

function goBack() {
  showPicker();
}

function doLogin() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  buildApp();
}

function doLogout() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'none';
  document.getElementById('picker').style.display = 'flex';
}

// ===================== COLOR HELPERS =====================
function applyColors(p1) {
  const r = document.documentElement;
  r.style.setProperty('--p1', p1);
  r.style.setProperty('--p2', adjustHex(p1, 20));
  r.style.setProperty('--p3', adjustHex(p1, 40));
  r.style.setProperty('--p4', hexToRgba(p1, 0.3));
  r.style.setProperty('--p5', hexToRgba(p1, 0.07));
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}
function hexToRgba(hex, a) {
  const {r,g,b} = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}
function adjustHex(hex, amount) {
  let {r,g,b} = hexToRgb(hex);
  r = Math.min(255, r + amount); g = Math.min(255, g + amount); b = Math.min(255, b + amount);
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function darken(hex, amount) {
  let {r,g,b} = hexToRgb(hex);
  r = Math.max(0, r - amount); g = Math.max(0, g - amount); b = Math.max(0, b - amount);
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function lighten(hex, amount) { return adjustHex(hex, amount); }

function uniEmoji(type) {
  return {auto:'🏛️', state:'🎓', rajabhat:'📚', rajamangala:'⚙️', private:'🏫'}[type] || '🏛️';
}

// ===================== BUILD APP =====================
function buildApp() {
  const u = UNI_DB[currentUni];
  applyColors(u.p1);

  // Topbar
  document.getElementById('tbEmoji').textContent = uniEmoji(u.type);
  document.getElementById('tbTitle').textContent = u.name + ' · ' + roleLabel(currentRole);

  const statsHTML = currentRole === 'rector'
    ? `<span class="tb-stat">🎓 ${uniStudents(currentUni)} นักศึกษา</span>
       <span class="tb-stat">👩‍🏫 ${uniFaculty(currentUni)} อาจารย์</span>
       <span class="tb-stat">💰 ${uniBudget(currentUni)}</span>
       <span class="tb-stat">📍 จ.${u.province}</span>`
    : currentRole === 'deputy'
    ? `<span class="tb-stat">📋 ${u.abbr}</span><span class="tb-stat">รองอธิการบดี</span><span class="tb-stat">📍 จ.${u.province}</span>`
    : `<span class="tb-stat">📋 ${u.abbr}</span><span class="tb-stat">เจ้าหน้าที่</span>`;
  document.getElementById('tbStats').innerHTML = statsHTML;

  // Build sidebar + content based on role
  if (currentRole === 'rector') buildRector(u);
  else if (currentRole === 'deputy') buildDeputy(u);
  else buildStaff(u);
}

function roleLabel(role) {
  return {rector:'อธิการบดี', deputy:'รองอธิการบดี', staff:'เจ้าหน้าที่'}[role] || role;
}

function uniStudents(slug) {
  const base = {cu:'36,000',mu:'30,000',ku:'65,000',kku:'42,000',cmu:'38,000',psu:'40,000',tu:'35,000'};
  return base[slug] || (Math.floor(Math.random()*15+5)*1000).toLocaleString();
}
function uniFaculty(slug) {
  const base = {cu:'3,200',mu:'4,800',ku:'2,800',kku:'2,400',cmu:'2,600',psu:'2,200',tu:'2,000'};
  return base[slug] || (Math.floor(Math.random()*800+400)).toLocaleString();
}
function uniBudget(slug) {
  const base = {cu:'12,400M',mu:'18,200M',ku:'8,600M',kku:'9,800M',cmu:'8,400M',psu:'7,200M',tu:'7,800M'};
  return base[slug] || (Math.floor(Math.random()*3000+800))+'M';
}

  el.classList.add('active');
}

document.addEventListener('DOMContentLoaded', function() {
  // MhesiDelegate.init is called after doLogin() which sets currentUni and currentRole
  // We hook into doLogin to call it after the app is built
  const origDoLogin = window.doLogin;
  window.doLogin = function() {
    origDoLogin();
    const u = UNI_DB[currentUni];
    const uniName = u ? u.name : currentUni;
    const roleName = {rector:'อธิการบดี', deputy:'รองอธิการบดี', staff:'เจ้าหน้าที่'}[currentRole] || currentRole;
    if (typeof MhesiDelegate !== 'undefined') {
      MhesiDelegate.init({
        myId: currentUni + '_' + currentRole,
        roleName: roleName,
        level: currentRole,
        reportsTo: currentRole === 'rector' ? 'deputy-ps' : currentRole === 'deputy' ? currentUni + '_rector' : currentUni + '_deputy',
        canAssignTo: currentRole === 'rector'
          ? [{id: currentUni + '_deputy', name: 'รอง' + uniName}]
          : currentRole === 'deputy'
          ? [{id: currentUni + '_staff', name: 'เจ้าหน้าที่'}]
          : []
      });
    }
  };
});
</script>
</body></html>
