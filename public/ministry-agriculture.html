<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>กระทรวงเกษตรและสหกรณ์ — PLAT Ministry Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0b1f3a;--navy2:#152d4f;--navy3:#1e3d68;--navy4:#2a5298;
  --gold:#c9a227;--gold2:#e8c55a;
  --green:#1a7a3a;--green2:#2ea855;--accent:#34c785;
  --red:#c0392b;--orange:#d35400;--blue:#2980b9;--purple:#7d3c98;--teal:#0e7490;
  --bg:#eef2f7;--surface:#fff;--border:#dde3ec;
  --text:#1a202c;--text2:#4a5568;--text3:#718096;
}
body{font-family:'Sarabun','Inter',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.55}
a{text-decoration:none;color:inherit}

.topbar{background:linear-gradient(135deg,var(--navy) 0%,var(--navy3) 100%);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.3);position:sticky;top:0;z-index:100}
.tb-l{display:flex;align-items:center;gap:14px}
.tb-logo{font-size:34px}
.tb-titles .t1{font-size:16px;font-weight:800}
.tb-titles .t2{font-size:11px;color:#94a8c0;margin-top:3px;letter-spacing:.04em}
.tb-r{display:flex;align-items:center;gap:10px}
.tb-link{font-size:11px;color:#cfd6e0;padding:6px 12px;border-radius:7px;border:1px solid rgba(255,255,255,.15)}
.tb-link:hover{background:rgba(255,255,255,.1);color:#fff}
.tb-link.gold{background:rgba(201,162,39,.15);border-color:var(--gold);color:var(--gold2);font-weight:700}

.hero{background:linear-gradient(135deg,var(--navy3) 0%,var(--navy4) 50%,var(--navy3) 100%);color:#fff;padding:40px 28px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 30%,rgba(201,162,39,.15) 0%,transparent 50%)}
.hero-inner{max-width:1320px;margin:0 auto;position:relative;z-index:2;display:grid;grid-template-columns:2fr 1fr;gap:30px}
@media(max-width:900px){.hero-inner{grid-template-columns:1fr}}
.hero-eyebrow{font-size:11px;letter-spacing:.2em;color:var(--gold2);font-weight:700;margin-bottom:10px;text-transform:uppercase}
.hero-title{font-size:34px;font-weight:800;line-height:1.2;margin-bottom:10px}
.hero-sub{font-size:14px;color:#cfd6e0;line-height:1.7;max-width:680px}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero-stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:12px 14px}
.hs-lab{font-size:10px;color:#94a8c0;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.hs-val{font-size:20px;font-weight:800;color:var(--gold2);font-family:'Inter','Sarabun',sans-serif}
.hs-sub{font-size:10px;color:#94a8c0;margin-top:2px}

.main{max-width:1320px;margin:0 auto;padding:24px}

.section{margin-top:24px}
.sec-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px;gap:14px;flex-wrap:wrap}
.sec-title{font-size:20px;font-weight:800;color:var(--navy)}
.sec-sub{font-size:11px;color:var(--text3);max-width:600px}

.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.05)}

/* DEPT GRID */
.dept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}
.dept-card{background:#fff;border:1px solid var(--border);border-radius:11px;padding:14px;border-left:4px solid var(--navy3)}
.dept-card.special{border-left-color:var(--gold);background:linear-gradient(to right,#fffbeb 0%,#fff 50%)}
.dept-card.warn{border-left-color:var(--orange);background:#fff7ed}
.dept-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dept-icon{font-size:26px}
.dept-code{font-size:9px;font-weight:700;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.dept-name{font-size:14px;font-weight:800;color:var(--navy);line-height:1.3;margin-top:2px}
.dept-head-pos{font-size:10px;color:var(--text3);margin-top:1px}
.dept-fn{font-size:11px;color:var(--text2);line-height:1.55;margin:6px 0}
.dept-presence{font-size:10px;color:var(--text3);background:#f7f9fc;padding:6px 8px;border-radius:6px;margin-top:6px}
.dept-progs{margin-top:8px}
.dept-progs-lab{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.dept-progs ul{padding-left:18px;font-size:10px;color:var(--text2);line-height:1.7}
.dept-note{font-size:10px;color:var(--orange);font-style:italic;margin-top:6px;padding-top:6px;border-top:1px dashed #fed7aa}

/* POLICY */
.policy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:11px}
.policy-card{background:linear-gradient(135deg,#fef3c7 0%,#fffbeb 100%);border:1px solid #fde68a;border-left:5px solid var(--gold);border-radius:11px;padding:14px}
.pol-name{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:5px}
.pol-meta{font-size:10px;color:var(--text2);margin-bottom:6px;line-height:1.6}
.pol-meta b{color:var(--navy)}
.pol-kpi{background:rgba(255,255,255,.85);border-radius:7px;padding:7px 10px;font-size:10px;color:var(--text);margin-top:6px;border-left:3px solid var(--green2);font-weight:600}
.pol-note{font-size:10px;color:var(--navy3);margin-top:5px;font-style:italic}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px}
.kpi-card{background:linear-gradient(135deg,#fff 0%,#f0fdf4 100%);border:1px solid #bbf7d0;border-radius:11px;padding:14px 16px;text-align:center}
.kpi-lab{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:8px}
.kpi-val{font-size:26px;font-weight:800;color:var(--green);font-family:'Inter','Sarabun',sans-serif}
.kpi-unit{font-size:11px;color:var(--text3);margin-top:2px}

/* PROVINCE ROLLOUT */
.rollout{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px}
.phase-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:11px;margin-top:14px}
.phase-card{padding:14px;border-radius:10px;text-align:center}
.ph-1{background:linear-gradient(135deg,#d1fae5 0%,#a7f3d0 100%);border:2px solid var(--green2)}
.ph-2{background:linear-gradient(135deg,#dbeafe 0%,#bfdbfe 100%);border:2px solid var(--navy4)}
.ph-3{background:linear-gradient(135deg,#fef3c7 0%,#fde68a 100%);border:2px solid var(--gold)}
.ph-4{background:linear-gradient(135deg,#e9d5ff 0%,#d8b4fe 100%);border:2px solid var(--purple)}
.ph-label{font-size:11px;font-weight:800;color:var(--navy);margin-bottom:6px;text-transform:uppercase;letter-spacing:.07em}
.ph-name{font-size:13px;font-weight:700;color:var(--navy);line-height:1.5}
.ph-status{display:inline-block;background:rgba(255,255,255,.7);padding:3px 9px;border-radius:5px;font-size:9px;font-weight:700;color:var(--navy);margin-top:6px}
.ph-link{display:inline-block;margin-top:7px;font-size:11px;color:var(--navy);font-weight:700;text-decoration:underline}

/* FOOTER */
footer{margin-top:36px;padding:24px;text-align:center;font-size:11px;color:var(--text3);border-top:1px solid var(--border)}
.sources{background:#f8fafc;border:1px dashed var(--border);border-radius:8px;padding:12px 16px;font-size:10px;color:var(--text3);margin-top:14px;text-align:left}
.sources b{color:var(--navy)}
.sources ul{margin-top:6px;padding-left:18px;line-height:1.7}

.loader{padding:80px 20px;text-align:center;color:var(--text3)}
.loader .sp{display:inline-block;width:40px;height:40px;border:3px solid #cbd5e0;border-top-color:var(--navy3);border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.lined-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.lined-table th{text-align:left;padding:7px;background:#f1f5f9;font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase}
.lined-table td{padding:8px;border-bottom:1px solid #ebeef3;color:var(--text2)}

/* 76-Province Grid */
.region-block{margin-top:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px 16px;backdrop-filter:blur(8px)}
.region-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.region-dot{width:10px;height:10px;border-radius:50%}
.region-name{font-size:13px;font-weight:800;color:#fff;letter-spacing:.02em}
.region-count{font-size:10px;color:#94a8c0;margin-left:auto;background:rgba(255,255,255,.07);padding:3px 9px;border-radius:10px;font-weight:700}
.prov-grid-76{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px}
.pchip{display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:8px;font-size:11px;cursor:pointer;transition:.15s;text-decoration:none;position:relative;overflow:hidden}
.pchip-code{background:rgba(0,0,0,.25);padding:2px 5px;border-radius:4px;font-size:9px;font-weight:800;font-family:Inter,Sarabun,sans-serif;flex-shrink:0}
.pchip-name{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip-badge{background:#34c785;color:#000;font-size:8px;font-weight:800;padding:1px 5px;border-radius:3px;letter-spacing:.04em;animation:pulse 2s infinite;flex-shrink:0}
.pchip-status{font-size:8px;opacity:.55;background:rgba(255,255,255,.08);padding:1px 5px;border-radius:3px;font-weight:600;flex-shrink:0}
.pchip-active{background:linear-gradient(135deg,rgba(46,168,85,.25),rgba(26,122,58,.35));color:#fff;border:1px solid rgba(46,168,85,.5);box-shadow:0 4px 14px rgba(46,168,85,.15)}
.pchip-active:hover{background:linear-gradient(135deg,rgba(46,168,85,.4),rgba(26,122,58,.5));border-color:#34c785;transform:translateY(-2px);box-shadow:0 8px 20px rgba(46,168,85,.3)}
.pchip-soon{background:rgba(255,255,255,.05);color:#6b7e96;border:1px solid rgba(255,255,255,.08);cursor:not-allowed;opacity:.65}
.pchip-soon:hover{opacity:.85;background:rgba(255,255,255,.07)}

</style>
</head>

<script>
const FORMAT = {

  billionBaht: n => (n==null) ? '—' : (n/1000000000).toLocaleString('th-TH',{maximumFractionDigits:2}) + ' พันล้านบาท',
};

async function load() {
  try {
    let d;
    if (window.MINISTRY_INLINE_DATA) {
      d = window.MINISTRY_INLINE_DATA;
    } else {
      const r = await fetch('ministry-data/agriculture.json');
      if (!r.ok) throw new Error('Cannot load ministry data: ' + r.status);
      d = await r.json();
    }
    document.title = d.ministry_name_th + ' — PLAT Thailand';
    render(d);
    setTimeout(loadMoacLive, 100);
  } catch(e) {
    const isFile = location.protocol === 'file:';
    document.getElementById('content').innerHTML =
      '<div style="padding:40px;text-align:center;color:#c0392b">⚠️ ' + e.message + '</div>' +
      (isFile ? '<div style="padding:20px;text-align:center;background:#fef3c7;margin:20px"><b>💡 เปิดแบบ file://</b> — browser block fetch()<br>' +

  }
}

/* === MOAC LIVE DATA === */
async function loadMoacLive() {
  const BASE = 'https://g2g-ai-pool.fly.dev/api/moac';
  const el = document.getElementById('moac-live-panel');
  if (!el) return;

  try {
    const [ovRes, pvRes, kpiRes] = await Promise.allSettled([
      fetch(BASE + '/overview').then(r=>r.json()),
      fetch(BASE + '/province-rollout').then(r=>r.json()),
      fetch(BASE + '/kpis').then(r=>r.json()),
    ]);

    const ov  = ovRes.status  === 'fulfilled' ? ovRes.value  : null;
    const pv  = pvRes.status  === 'fulfilled' ? pvRes.value  : null;
    const kpi = kpiRes.status === 'fulfilled' ? kpiRes.value : null;

    let h = '<div class="section">';
    h += '<div class="sec-head"><div><div class="sec-title">📡 ข้อมูล Live จาก PLAT API</div>';
    h += '<div class="sec-sub">อัปเดตอัตโนมัติ · ' + new Date().toLocaleString("th-TH") + '</div></div>';
    h += '<button onclick="loadMoacLive()" style="background:#1e6640;color:#fff;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px">🔄 รีเฟรช</button>';
    h += '</div>';

    /* Province Rollout */
    if (pv && pv.ok) {
      const pvs = pv.provinces || pv.rollout || [];
      h += '<div class="card"><div class="card-head"><div class="card-title">🗺️ สถานะ PLAT Rollout รายจังหวัด (Live)</div></div>';
      if (pvs.length) {
        h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">';
        pvs.forEach(p => {
          const pct = p.progress_pct || p.completion_pct || p.progress || 0;
          const statusColor = pct >= 80 ? '#388e3c' : (pct >= 50 ? '#f57c00' : '#1565c0');
          const statusText  = pct >= 80 ? 'ดำเนินการดี' : (pct >= 50 ? 'กำลังดำเนินการ' : 'เริ่มต้น');
          h += '<div style="background:#f7f9fc;border-radius:10px;padding:14px;border-top:4px solid ' + statusColor + '">';
          h += '<div style="font-weight:700;font-size:14px">' + (p.province||p.name) + '</div>';
          h += '<div style="font-size:12px;color:#555;margin:4px 0">' + (p.note||statusText) + '</div>';
          h += '<div style="font-size:24px;font-weight:800;color:' + statusColor + ';font-family:Inter,Sarabun,sans-serif">' + pct + '%</div>';
          h += '<div style="background:#e0e0e0;border-radius:99px;height:8px;margin-top:6px"><div style="background:' + statusColor + ';width:' + pct + '%;height:100%;border-radius:99px"></div></div>';
          if (p.farmers_enrolled) h += '<div style="font-size:11px;color:var(--text3);margin-top:4px">เกษตรกร: ' + p.farmers_enrolled.toLocaleString('th-TH') + ' ราย</div>';
          h += '</div>';
        });
        h += '</div>';
      }
      h += '</div>';
    }

    /* KPIs */
    if (kpi && kpi.ok) {
      const kpis = kpi.kpis || [];
      h += '<div class="card"><div class="card-head"><div class="card-title">📊 KPI กระทรวงเกษตรฯ ปีงบ 2568</div></div>';
      if (kpis.length) {
        h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px">';
        kpis.forEach(k => {
          const pct = k.achievement_pct || k.progress || 0;
          const c = pct >= 100 ? '#388e3c' : (pct >= 70 ? '#f57c00' : '#1565c0');
          h += '<div style="background:#f7f9fc;border-radius:10px;padding:12px;border-left:4px solid ' + c + '">';
          h += '<div style="font-size:12px;color:var(--text3)">' + (k.name||k.indicator) + '</div>';
          h += '<div style="font-size:16px;font-weight:700;color:var(--navy);margin:4px 0">' + (k.value||k.current||'—') + '</div>';
          if (k.target) h += '<div style="font-size:11px;color:#888">เป้า: ' + k.target + '</div>';
          if (pct) {
            h += '<div style="background:#e0e0e0;border-radius:99px;height:6px;margin-top:6px"><div style="background:' + c + ';width:' + Math.min(pct,100) + '%;height:100%;border-radius:99px"></div></div>';
            h += '<div style="font-size:11px;color:' + c + ';font-weight:700">' + pct + '%</div>';
          }
          h += '</div>';
        });
        h += '</div>';
      }
      h += '</div>';
    }

    /* Overview stats */
    if (ov && ov.ok) {
      h += '<div class="card"><div class="card-head"><div class="card-title">📋 ข้อมูลพื้นฐานกระทรวง (Live)</div></div>';
      h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px">';
      const items = [
        {lab:'งบประมาณ 2568', val: (ov.fiscal_year_2568_budget_baht/1e9).toFixed(1) + ' พันล้านบาท'},
        {lab:'เกษตรกรในระบบ', val: (ov.thai_farmer_count_total/1e6).toFixed(1) + ' ล้านคน'},
        {lab:'บุคลากร', val: (ov.personnel_count_total||0).toLocaleString('th-TH') + ' คน'},
        {lab:'กรม/หน่วยงาน', val: (ov.departments_count||16) + ' กรม'},
      ];
      items.forEach(i => {
        h += '<div style="background:#e8f5e9;border-radius:10px;padding:12px;text-align:center">';
        h += '<div style="font-size:11px;color:#555;margin-bottom:4px">' + i.lab + '</div>';
        h += '<div style="font-size:18px;font-weight:800;color:#1e6640;font-family:Inter,Sarabun,sans-serif">' + i.val + '</div>';
        h += '</div>';
      });
      h += '</div></div>';
    }

    h += '</div>';
    el.innerHTML = h;
  } catch(e) {
    document.getElementById('moac-live-panel').innerHTML =
      '<div style="padding:12px;color:var(--text3);font-size:13px">⚠️ ไม่สามารถโหลด Live data: ' + e.message + '</div>';
  }
}

load();
loadMoacLive();
</script>
