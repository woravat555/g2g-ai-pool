<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>กระทรวงมหาดไทย — PLAT Ministry Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0b1f3a;--navy2:#152d4f;--navy3:#1e3d68;--navy4:#2a5298;
  --moi-dark:#1a237e;--moi-mid:#283593;--moi-light:#3949ab;
  --gold:#ffd600;--gold2:#ffee58;
  --green:#1a7a3a;--green2:#2ea855;--accent:#34c785;
  --red:#c0392b;--orange:#d35400;--blue:#2980b9;--purple:#7d3c98;--teal:#0e7490;
  --bg:#e8eaf6;--surface:#fff;--border:#dde3ec;
  --text:#1a202c;--text2:#4a5568;--text3:#718096;
}
body{font-family:'Sarabun','Inter',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.55}
a{text-decoration:none;color:inherit}

.topbar{background:linear-gradient(135deg,var(--moi-dark) 0%,var(--moi-mid) 100%);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.3);position:sticky;top:0;z-index:100}
.tb-l{display:flex;align-items:center;gap:14px}
.tb-logo{font-size:34px}
.tb-titles .t1{font-size:16px;font-weight:800}
.tb-titles .t2{font-size:11px;color:#9fa8da;margin-top:3px;letter-spacing:.04em}
.tb-r{display:flex;align-items:center;gap:10px}
.tb-link{font-size:11px;color:#cfd6e0;padding:6px 12px;border-radius:7px;border:1px solid rgba(255,255,255,.15)}
.tb-link:hover{background:rgba(255,255,255,.1);color:#fff}
.tb-link.gold{background:rgba(255,214,0,.15);border-color:var(--gold);color:var(--gold2);font-weight:700}
.tb-link.active{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.5);color:#fff;font-weight:700}

.hero{background:linear-gradient(135deg,var(--moi-dark) 0%,var(--moi-mid) 50%,var(--moi-dark) 100%);color:#fff;padding:40px 28px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 30%,rgba(255,214,0,.15) 0%,transparent 50%)}
.hero-inner{max-width:1320px;margin:0 auto;position:relative;z-index:2;display:grid;grid-template-columns:2fr 1fr;gap:30px}
@media(max-width:900px){.hero-inner{grid-template-columns:1fr}}
.hero-eyebrow{font-size:11px;letter-spacing:.2em;color:var(--gold2);font-weight:700;margin-bottom:10px;text-transform:uppercase}
.hero-title{font-size:34px;font-weight:800;line-height:1.2;margin-bottom:10px}
.hero-sub{font-size:14px;color:#9fa8da;line-height:1.7;max-width:680px}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero-stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:12px 14px}
.hs-lab{font-size:10px;color:#9fa8da;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.hs-val{font-size:20px;font-weight:800;color:var(--gold2);font-family:'Inter','Sarabun',sans-serif}
.hs-sub{font-size:10px;color:#94a8c0;margin-top:2px}

.main{max-width:1320px;margin:0 auto;padding:24px}

.section{margin-top:24px}
.sec-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px;gap:14px;flex-wrap:wrap}
.sec-title{font-size:20px;font-weight:800;color:var(--moi-dark)}
.sec-sub{font-size:11px;color:var(--text3);max-width:600px}

.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.05)}

.dept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}
.dept-card{background:#fff;border:1px solid var(--border);border-radius:11px;padding:14px;border-left:4px solid var(--moi-mid)}
.dept-card.special{border-left-color:var(--gold);background:linear-gradient(to right,#fffde7 0%,#fff 50%)}
.dept-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dept-icon{font-size:26px}
.dept-code{font-size:9px;font-weight:700;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.dept-name{font-size:14px;font-weight:800;color:var(--moi-dark);line-height:1.3;margin-top:2px}
.dept-fn{font-size:11px;color:var(--text2);line-height:1.55;margin:6px 0}
.dept-budget{font-size:10px;color:var(--text3);background:#f7f9fc;padding:6px 8px;border-radius:6px;margin-top:6px}

.policy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:11px}
.policy-card{background:linear-gradient(135deg,#e8eaf6 0%,#fff 100%);border:1px solid #c5cae9;border-left:5px solid var(--moi-mid);border-radius:11px;padding:14px}
.pol-name{font-size:13px;font-weight:800;color:var(--moi-dark);margin-bottom:5px}
.pol-desc{font-size:11px;color:var(--text2);margin-bottom:8px;line-height:1.6}
.pol-status{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;margin-bottom:6px}
.pol-status.active{background:#e8f5e9;color:#1a7a3a}
.pol-status.starting{background:#fff3e0;color:#d35400}
.pol-bar-wrap{background:#e0e0e0;border-radius:99px;height:8px;margin:6px 0}
.pol-bar-fill{background:var(--moi-mid);height:100%;border-radius:99px}
.pol-pct{font-size:11px;font-weight:700;color:var(--moi-dark)}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px}
.kpi-card{background:linear-gradient(135deg,#fff 0%,#e8eaf6 100%);border:1px solid #c5cae9;border-radius:11px;padding:14px 16px;text-align:center}
.kpi-lab{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:8px}
.kpi-val{font-size:26px;font-weight:800;color:var(--moi-dark);font-family:'Inter','Sarabun',sans-serif}
.kpi-unit{font-size:11px;color:var(--text3);margin-top:2px}

.rollout-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}
.rollout-table th{text-align:left;padding:8px 10px;background:var(--moi-dark);color:#fff;font-size:10px;text-transform:uppercase;font-weight:700}
.rollout-table td{padding:10px;border-bottom:1px solid #ebeef3;color:var(--text2)}
.rollout-table tr:hover td{background:#f0f4ff}
.prov-pct{font-size:18px;font-weight:800;color:var(--moi-dark);font-family:'Inter','Sarabun',sans-serif}
.pbar{background:#e0e0e0;border-radius:99px;height:7px;margin-top:4px;min-width:100px}
.pbar-fill{background:var(--moi-mid);height:100%;border-radius:99px}

.sources{background:#f8fafc;border:1px dashed var(--border);border-radius:8px;padding:12px 16px;font-size:10px;color:var(--text3);margin-top:14px;text-align:left}
.sources b{color:var(--moi-dark)}
.sources ul{margin-top:6px;padding-left:18px;line-height:1.7}

.loader{padding:80px 20px;text-align:center;color:var(--text3)}
.loader .sp{display:inline-block;width:40px;height:40px;border:3px solid #cbd5e0;border-top-color:var(--moi-dark);border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

footer{margin-top:36px;padding:24px;text-align:center;font-size:11px;color:var(--text3);border-top:1px solid var(--border)}
</style>
</head>
<body>

<script>
const FORMAT = {
  num: n => (n==null) ? '—' : n.toLocaleString('th-TH'),
  millionBaht: n => (n==null) ? '—' : (n/1000000).toLocaleString('th-TH',{maximumFractionDigits:1}) + ' ล้านบาท',
  billionBaht: n => (n==null) ? '—' : (n/1000000000).toLocaleString('th-TH',{maximumFractionDigits:2}) + ' พันล้านบาท',
};

function render(d) {
  document.getElementById('content').innerHTML =
    renderHero(d) +
    '<div id="moi-live-panel"><div style="padding:16px;text-align:center;color:#888;font-size:13px">📡 กำลังโหลดข้อมูล Live จาก MOI API…</div></div>' +
    '<div class="main">' +
      renderKPIs(d) +
      renderPolicies(d) +
      renderDepartments(d) +
      renderRollout(d) +
    '</div>';
}

function renderHero(d) {
  const m = d.ministry || {};
  const K = d.key_kpis || {};
  return '<div class="hero"><div class="hero-inner">' +
    '<div>' +
      '<div class="hero-eyebrow">PLAT · กระทรวงมหาดไทย</div>' +
      '<div class="hero-title">🏛️ ' + (m.name_th || 'กระทรวงมหาดไทย') + '</div>' +
      '<div class="hero-sub"><b>พันธกิจ:</b> บริหารราชการและพัฒนาคุณภาพชีวิตประชาชนใน 77 จังหวัด ผ่านการปกครองท้องที่และท้องถิ่นที่เข้มแข็ง</div>' +
      '<div class="hero-sub" style="margin-top:8px"><b>วิสัยทัศน์:</b> ประชาชนมีความสุข ชุมชนเข้มแข็ง ท้องถิ่นพัฒนา ประเทศมั่นคง</div>' +
      '<div class="hero-sub" style="margin-top:10px;font-size:11px;opacity:.85">📜 พ.ร.บ.ปรับปรุงกระทรวง ทบวง กรม พ.ศ.2545 · 📅 จัดตั้ง พ.ศ.' + (m.established || 2435) + '</div>' +
    '</div>' +
    '<div class="hero-stats">' +
      '<div class="hero-stat"><div class="hs-lab">งบประมาณปี 2568</div><div class="hs-val">420 พันล้านบาท</div><div class="hs-sub">ใหญ่ที่สุดในบรรดากระทรวง</div></div>' +
      '<div class="hero-stat"><div class="hs-lab">จังหวัดที่ดูแล</div><div class="hs-val">77 จังหวัด</div><div class="hs-sub">ครบทุกจังหวัดทั่วไทย</div></div>' +
      '<div class="hero-stat"><div class="hs-lab">องค์กรปกครองท้องถิ่น</div><div class="hs-val">' + FORMAT.num(K.aot_count) + ' แห่ง</div><div class="hs-sub">อบจ./เทศบาล/อบต.</div></div>' +
      '<div class="hero-stat"><div class="hs-lab">ประชากรในระบบ</div><div class="hs-val">67 ล้านคน</div><div class="hs-sub">ทะเบียนราษฎร์แห่งชาติ</div></div>' +
    '</div>' +
  '</div></div>';
}

function renderKPIs(d) {
  const K = d.key_kpis || {};
  const items = [
    {lab: 'จังหวัดที่ครอบคลุม', val: (K.provinces_covered||77) + ' จว.', sub: 'ครบทั้งประเทศ'},
    {lab: 'องค์กรปกครองท้องถิ่น', val: FORMAT.num(K.aot_count), sub: 'อบจ./เทศบาล/อบต.'},
    {lab: 'ประชากรในระบบ', val: ((K.population_registry||67000000)/1000000).toFixed(0) + ' ล้านคน', sub: 'ทะเบียนราษฎร์'},
    {lab: 'โฉนดที่ดินดิจิทัล', val: (K.land_title_digital_pct||72) + '%', sub: 'เป้าหมาย 80%'},
    {lab: 'สินค้า OTOP', val: FORMAT.num(K.otop_products), sub: 'รายการทั่วประเทศ'},
    {lab: 'เวลาตอบสนองภัยพิบัติ', val: (K.disaster_response_min||45) + ' นาที', sub: 'เฉลี่ยทั่วประเทศ'},
  ];
  return '<div class="section"><div class="sec-head">' +
    '<div><div class="sec-title">📊 ตัวชี้วัดสำคัญ กระทรวงมหาดไทย 2568</div>' +
    '<div class="sec-sub">ข้อมูลจากเอกสารงบประมาณรายจ่ายประจำปี 2568 และรายงานประจำปีกระทรวงมหาดไทย</div></div></div>' +
    '<div class="kpi-grid">' +
      items.map(i => '<div class="kpi-card">' +
        '<div class="kpi-lab">' + i.lab + '</div>' +
        '<div class="kpi-val">' + i.val + '</div>' +
        '<div class="kpi-unit">' + i.sub + '</div>' +
      '</div>').join('') +
    '</div></div>';
}

function renderPolicies(d) {
  const pols = d.policies || [];
  return '<div class="section"><div class="sec-head">' +
    '<div><div class="sec-title">🎯 นโยบายเร่งด่วน กระทรวงมหาดไทย ปี 2568</div>' +
    '<div class="sec-sub">' + pols.length + ' นโยบายหลัก — ขับเคลื่อนดิจิทัลและการพัฒนาท้องถิ่น</div></div></div>' +
    '<div class="policy-grid">' +
      pols.map(p => {
        const isActive = p.status === 'กำลังดำเนินการ';
        const statusCls = isActive ? 'active' : 'starting';
        return '<div class="policy-card">' +
          '<div class="pol-name">' + p.title + '</div>' +
          '<span class="pol-status ' + statusCls + '">' + p.status + '</span>' +
          '<div class="pol-desc">' + p.description + '</div>' +
          '<div class="pol-bar-wrap"><div class="pol-bar-fill" style="width:' + p.progress + '%"></div></div>' +
          '<div class="pol-pct">ความก้าวหน้า: ' + p.progress + '% · งบ ' + FORMAT.num(p.budget) + ' ล้านบาท</div>' +
        '</div>';
      }).join('') +
    '</div></div>';
}

function renderDepartments(d) {
  const deps = d.departments || [];
  const icons = {DOPA:'🏛️', DLA:'🏘️', DPT:'🏗️', CDD:'🤝', DDPM:'🚨', DOL:'📐'};
  return '<div class="section"><div class="sec-head">' +
    '<div><div class="sec-title">🏛️ กรม / หน่วยงานในกระทรวงมหาดไทย</div>' +
    '<div class="sec-sub">' + deps.length + ' กรมหลัก รับผิดชอบงานปกครอง ท้องถิ่น โยธา ชุมชน และที่ดิน</div></div></div>' +
    '<div class="dept-grid">' +
      deps.map(dep => {
        const ic = dep.icon || icons[dep.code] || '🏢';
        const cls = dep.code === 'DOPA' ? 'dept-card special' : 'dept-card';
        return '<div class="' + cls + '">' +
          '<div class="dept-head">' +
            '<div class="dept-icon">' + ic + '</div>' +
            '<div>' +
              '<div class="dept-code">' + dep.code + ' · ' + (dep.name_en||'') + '</div>' +
              '<div class="dept-name">' + dep.name + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="dept-fn">🎯 ' + dep.focus + '</div>' +
          '<div class="dept-budget">👥 บุคลากร: ' + FORMAT.num(dep.staff) + ' คน · งบ: ' + FORMAT.num(dep.budget) + ' ล้านบาท</div>' +
        '</div>';
      }).join('') +
    '</div></div>';
}

function renderRollout(d) {
  const provs = d.province_rollout || [];
  return '<div class="section"><div class="sec-head">' +
    '<div><div class="sec-title">🗺️ การขยาย PLAT × มหาดไทย รายจังหวัด</div>' +
    '<div class="sec-sub">บูรณาการระบบปกครองท้องถิ่นและทะเบียนราษฎร์กับแพลตฟอร์ม PLAT</div></div></div>' +
    '<div class="card">' +
      '<table class="rollout-table">' +
        '<thead><tr><th>จังหวัด</th><th>Phase</th><th>โฟกัส</th><th>ความก้าวหน้า</th></tr></thead>' +
        '<tbody>' +
          provs.map(p => {
            const c = p.completion_pct >= 70 ? '#1a7a3a' : (p.completion_pct >= 55 ? '#f57c00' : '#1565c0');
            return '<tr>' +
              '<td style="font-weight:700;color:var(--moi-dark)">' + p.province + '</td>' +
              '<td><span style="background:' + (p.phase===1?'#e8f5e9':'#e8eaf6') + ';color:' + (p.phase===1?'#1a7a3a':'#1a237e') + ';padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700">Phase ' + p.phase + '</span></td>' +
              '<td style="font-size:11px;color:var(--text2)">' + p.focus + '</td>' +
              '<td><div class="prov-pct" style="color:' + c + '">' + p.completion_pct + '%</div>' +
                '<div class="pbar"><div class="pbar-fill" style="width:' + p.completion_pct + '%;background:' + c + '"></div></div></td>' +
            '</tr>';
          }).join('') +
        '</tbody>' +
      '</table>' +
    '</div></div>';
}

/* === MOI LIVE DATA === */
async function loadMoiLive() {
  const BASE = 'https://g2g-ai-pool.fly.dev/api/moi';
  const KEY = 'moi2026';
  const el = document.getElementById('moi-live-panel');
  if (!el) return;

  try {
    const [ovRes, pvRes, kpiRes] = await Promise.allSettled([
      fetch(BASE + '/overview', {headers: {'x-api-key': KEY}}).then(r=>r.json()),
      fetch(BASE + '/province-rollout', {headers: {'x-api-key': KEY}}).then(r=>r.json()),
      fetch(BASE + '/kpis', {headers: {'x-api-key': KEY}}).then(r=>r.json()),
    ]);

    const ov  = ovRes.status  === 'fulfilled' ? ovRes.value  : null;
    const pv  = pvRes.status  === 'fulfilled' ? pvRes.value  : null;
    const kpi = kpiRes.status === 'fulfilled' ? kpiRes.value : null;

    let h = '<div class="section">';
    h += '<div class="sec-head"><div><div class="sec-title">📡 ข้อมูล Live จาก MOI API</div>';
    h += '<div class="sec-sub">อัปเดตอัตโนมัติ · ' + new Date().toLocaleString('th-TH') + '</div></div>';
    h += '<button onclick="loadMoiLive()" style="background:#1a237e;color:#fff;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px">🔄 รีเฟรช</button>';
    h += '</div>';

    if (pv && pv.provinces && pv.provinces.length) {
      h += '<div class="card"><div style="font-weight:800;font-size:15px;color:var(--moi-dark);margin-bottom:12px">🗺️ สถานะ MOI Rollout รายจังหวัด (Live)</div>';
      h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">';
      pv.provinces.forEach(function(p) {
        var pct = p.completion_pct || 0;
        var statusColor = pct >= 70 ? '#1a7a3a' : (pct >= 55 ? '#f57c00' : '#1565c0');
        h += '<div style="background:#f7f9fc;border-radius:10px;padding:14px;border-top:4px solid ' + statusColor + '">';
        h += '<div style="font-weight:700;font-size:14px;color:#1a237e">' + p.province + '</div>';
        h += '<div style="font-size:11px;color:#555;margin:4px 0">' + (p.focus||'') + '</div>';
        h += '<div style="font-size:24px;font-weight:800;color:' + statusColor + ';font-family:Inter,Sarabun,sans-serif">' + pct + '%</div>';
        h += '<div style="background:#e0e0e0;border-radius:99px;height:8px;margin-top:6px"><div style="background:' + statusColor + ';width:' + pct + '%;height:100%;border-radius:99px"></div></div>';
        h += '</div>';
      });
      h += '</div></div>';
    }

    if (kpi && kpi.kpis && kpi.kpis.length) {
      h += '<div class="card" style="margin-top:14px"><div style="font-weight:800;font-size:15px;color:var(--moi-dark);margin-bottom:12px">📊 KPI กระทรวงมหาดไทย ปีงบ 2568</div>';
      h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px">';
      kpi.kpis.forEach(function(k) {
        var pct = k.achievement_pct || 0;
        var c = pct >= 100 ? '#388e3c' : (pct >= 70 ? '#f57c00' : '#1565c0');
        h += '<div style="background:#f7f9fc;border-radius:10px;padding:12px;border-left:4px solid ' + c + '">';
        h += '<div style="font-size:12px;color:var(--text3)">' + k.name + '</div>';
        h += '<div style="font-size:16px;font-weight:700;color:var(--moi-dark);margin:4px 0">' + k.value + '</div>';
        if (k.target) h += '<div style="font-size:11px;color:#888">เป้า: ' + k.target + '</div>';
        h += '<div style="background:#e0e0e0;border-radius:99px;height:6px;margin-top:6px"><div style="background:' + c + ';width:' + Math.min(pct,100) + '%;height:100%;border-radius:99px"></div></div>';
        h += '<div style="font-size:11px;color:' + c + ';font-weight:700">' + pct + '%</div>';
        h += '</div>';
      });
      h += '</div></div>';
    }

    if (ov && ov.ministry) {
      h += '<div class="card" style="margin-top:14px"><div style="font-weight:800;font-size:15px;color:var(--moi-dark);margin-bottom:12px">📋 ข้อมูลพื้นฐานกระทรวง (Live)</div>';
      h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px">';
      var oItems = [
        {lab:'กรม/หน่วยงาน', val: (ov.departments_count||6) + ' กรม'},
        {lab:'นโยบายสำคัญ', val: (ov.policies_count||6) + ' นโยบาย'},
        {lab:'อปท.ทั่วประเทศ', val: ((ov.key_kpis||{}).aot_count||7850).toLocaleString('th-TH') + ' แห่ง'},
        {lab:'ประชากร', val: (((ov.key_kpis||{}).population_registry||67000000)/1000000).toFixed(0) + ' ล้านคน'},
      ];
      oItems.forEach(function(i) {
        h += '<div style="background:#e8eaf6;border-radius:10px;padding:12px;text-align:center">';
        h += '<div style="font-size:11px;color:#555;margin-bottom:4px">' + i.lab + '</div>';
        h += '<div style="font-size:18px;font-weight:800;color:#1a237e;font-family:Inter,Sarabun,sans-serif">' + i.val + '</div>';
        h += '</div>';
      });
      h += '</div></div>';
    }

    h += '</div>';
    el.innerHTML = h;
  } catch(e) {
    document.getElementById('moi-live-panel').innerHTML =
      '<div style="padding:12px;color:var(--text3);font-size:13px">⚠️ ไม่สามารถโหลด Live data: ' + e.message + '</div>';
  }
}

const d = window.MINISTRY_INLINE_DATA;
render(d);
loadMoiLive();
</script>

<script src="/access-bar.js"></script>
</body>
</html>
