<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>กระทรวงสาธารณสุข — PLAT Ministry Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0b1f3a;--navy2:#152d4f;--navy3:#1e3d68;--navy4:#2a5298;
  --gold:#c9a227;--gold2:#e8c55a;
  --green:#1b5e20;--green2:#2e7d32;--accent:#76ff03;
  --red:#c0392b;--orange:#d35400;--blue:#2980b9;--purple:#7d3c98;--teal:#0e7490;
  --bg:#eef2f7;--surface:#fff;--border:#dde3ec;
  --text:#1a202c;--text2:#4a5568;--text3:#718096;
}
body{font-family:'Sarabun','Inter',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.55}
a{text-decoration:none;color:inherit}

.topbar{background:linear-gradient(135deg,var(--navy) 0%,var(--navy3) 100%);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.3);position:sticky;top:0;z-index:100}
.tb-l{display:flex;align-items:center;gap:14px}
.tb-logo{font-size:34px}
.tb-titles .t1{font-size:16px;font-weight:800}
.tb-titles .t2{font-size:11px;color:#94a8c0;margin-top:3px;letter-spacing:.04em}
.tb-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tb-link{font-size:11px;color:#cfd6e0;padding:6px 12px;border-radius:7px;border:1px solid rgba(255,255,255,.15)}
.tb-link:hover{background:rgba(255,255,255,.1);color:#fff}
.tb-link.gold{background:rgba(201,162,39,.15);border-color:var(--gold);color:var(--gold2);font-weight:700}
.tb-link.health{background:rgba(27,94,32,.3);border-color:#76ff03;color:#76ff03;font-weight:700}

.hero{background:linear-gradient(135deg,#0d3b14 0%,#1b5e20 50%,#2e7d32 100%);color:#fff;padding:40px 28px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 30%,rgba(118,255,3,.12) 0%,transparent 50%)}
.hero-inner{max-width:1320px;margin:0 auto;position:relative;z-index:2;display:grid;grid-template-columns:2fr 1fr;gap:30px}
@media(max-width:900px){.hero-inner{grid-template-columns:1fr}}
.hero-eyebrow{font-size:11px;letter-spacing:.2em;color:#a5d6a7;font-weight:700;margin-bottom:10px;text-transform:uppercase}
.hero-title{font-size:34px;font-weight:800;line-height:1.2;margin-bottom:10px}
.hero-sub{font-size:14px;color:#c8e6c9;line-height:1.7;max-width:680px}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero-stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:12px 14px}
.hs-lab{font-size:10px;color:#a5d6a7;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.hs-val{font-size:20px;font-weight:800;color:#76ff03;font-family:'Inter','Sarabun',sans-serif}
.hs-sub{font-size:10px;color:#a5d6a7;margin-top:2px}

.main{max-width:1320px;margin:0 auto;padding:24px}
.section{margin-top:24px}
.sec-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px;gap:14px;flex-wrap:wrap}
.sec-title{font-size:20px;font-weight:800;color:var(--green)}
.sec-sub{font-size:11px;color:var(--text3);max-width:600px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.05)}

/* DEPT GRID */
.dept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}
.dept-card{background:#fff;border:1px solid var(--border);border-radius:11px;padding:14px;border-left:4px solid var(--green)}
.dept-card.special{border-left-color:#76ff03;background:linear-gradient(to right,#f1f8e9 0%,#fff 50%)}
.dept-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dept-icon{font-size:26px}
.dept-code{font-size:9px;font-weight:700;color:var(--green);letter-spacing:.06em;text-transform:uppercase}
.dept-name{font-size:14px;font-weight:800;color:var(--navy);line-height:1.3;margin-top:2px}
.dept-fn{font-size:11px;color:var(--text2);line-height:1.55;margin:6px 0}
.dept-stats{display:flex;gap:8px;margin-top:8px}
.dept-stat-chip{background:#f1f8e9;border:1px solid #c8e6c9;border-radius:6px;padding:4px 8px;font-size:10px;color:var(--green)}
.dept-stat-chip b{font-weight:800}

/* POLICY */
.policy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:11px}
.policy-card{background:linear-gradient(135deg,#e8f5e9 0%,#f1f8e9 100%);border:1px solid #c8e6c9;border-left:5px solid var(--green);border-radius:11px;padding:14px}
.pol-name{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:5px}
.pol-meta{font-size:10px;color:var(--text2);margin-bottom:6px;line-height:1.6}
.pol-meta b{color:var(--navy)}
.pol-progress{margin-top:8px}
.pol-progress-bar{background:#c8e6c9;border-radius:99px;height:8px;overflow:hidden;margin-top:4px}
.pol-progress-fill{background:linear-gradient(90deg,var(--green),#76ff03);height:100%;border-radius:99px;transition:width .5s}
.pol-pct{font-size:11px;font-weight:800;color:var(--green);margin-top:3px}
.pol-budget{font-size:10px;color:var(--text3);margin-top:4px}
.pol-status{display:inline-block;background:rgba(27,94,32,.12);color:var(--green);font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;margin-bottom:4px}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px}
.kpi-card{background:linear-gradient(135deg,#fff 0%,#e8f5e9 100%);border:1px solid #c8e6c9;border-radius:11px;padding:14px 16px;text-align:center}
.kpi-lab{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:8px}
.kpi-val{font-size:26px;font-weight:800;color:var(--green);font-family:'Inter','Sarabun',sans-serif}
.kpi-unit{font-size:11px;color:var(--text3);margin-top:2px}

/* PROVINCE ROLLOUT */
.rollout{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px}
.phase-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:11px;margin-top:14px}
.phase-card{padding:14px;border-radius:10px;text-align:center}
.ph-1{background:linear-gradient(135deg,#c8e6c9 0%,#a5d6a7 100%);border:2px solid var(--green2)}
.ph-2{background:linear-gradient(135deg,#dbeafe 0%,#bfdbfe 100%);border:2px solid var(--navy4)}
.ph-label{font-size:11px;font-weight:800;color:var(--navy);margin-bottom:4px;text-transform:uppercase;letter-spacing:.07em}
.ph-name{font-size:14px;font-weight:800;color:var(--navy);line-height:1.3}
.ph-focus{font-size:10px;color:var(--text2);margin-top:4px}
.ph-pct{font-size:22px;font-weight:800;color:var(--green);margin-top:6px;font-family:'Inter',sans-serif}
.ph-bar{background:rgba(255,255,255,.5);border-radius:99px;height:6px;margin-top:8px;overflow:hidden}
.ph-bar-fill{background:var(--green);height:100%;border-radius:99px}

/* LIVE PANEL */
.live-panel{background:linear-gradient(135deg,#e8f5e9 0%,#f1f8e9 100%);border:2px solid #76ff03;border-radius:14px;padding:20px;margin-top:24px}
.live-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.live-badge{display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#fff;font-size:11px;font-weight:800;padding:5px 12px;border-radius:20px;letter-spacing:.04em}
.live-dot{width:8px;height:8px;background:#76ff03;border-radius:50%;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.live-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.live-kpi{background:#fff;border:1px solid #c8e6c9;border-radius:10px;padding:12px;text-align:center}
.live-kpi-lab{font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;margin-bottom:4px}
.live-kpi-val{font-size:20px;font-weight:800;color:var(--green);font-family:'Inter',sans-serif}
.live-kpi-ach{font-size:10px;color:var(--text3);margin-top:2px}
.live-prov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.live-prov{background:#fff;border:1px solid #c8e6c9;border-radius:10px;padding:12px}
.live-prov-name{font-size:12px;font-weight:800;color:var(--navy)}
.live-prov-focus{font-size:10px;color:var(--text2);margin-top:2px}
.live-prov-bar{background:#e8f5e9;border-radius:99px;height:6px;margin-top:6px}
.live-prov-fill{background:linear-gradient(90deg,var(--green),#76ff03);height:100%;border-radius:99px}
.live-prov-pct{font-size:11px;font-weight:800;color:var(--green);margin-top:3px;font-family:'Inter',sans-serif}
.refresh-btn{background:var(--green);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-family:'Sarabun',sans-serif;font-size:12px;font-weight:700;cursor:pointer}
.refresh-btn:hover{background:var(--green2)}
.live-ts{font-size:10px;color:var(--text3);margin-top:10px}

/* FOOTER */
footer{margin-top:36px;padding:24px;text-align:center;font-size:11px;color:var(--text3);border-top:1px solid var(--border)}
.loader{padding:80px 20px;text-align:center;color:var(--text3)}
.loader .sp{display:inline-block;width:40px;height:40px;border:3px solid #cbd5e0;border-top-color:var(--green);border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-l">
    <div class="tb-logo"><img class="ministry-logo-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fe/Seal_of_the_Ministry_of_Public_Health_of_Thailand.svg/250px-Seal_of_the_Ministry_of_Public_Health_of_Thailand.svg.png" style="width:60px;height:60px;object-fit:contain;vertical-align:middle;margin-right:8px;" onerror="this.style.display='none'" alt="ตรากระทรวงสาธารณสุข">🏥</div>
    <div class="tb-titles">
      <div class="t1">กระทรวงสาธารณสุข</div>
      <div class="t2">MINISTRY OF PUBLIC HEALTH · PLAT Thailand</div>
    </div>
  </div>
  <div class="tb-r">
    <a href="/phrae.html" class="tb-link">🏔️ แพร่</a>
    <a href="/chiangrai.html" class="tb-link">🏔️ เชียงราย</a>
    <a href="/udonthani.html" class="tb-link">🌾 อุดรธานี</a>
    <a href="/ministry-agriculture.html" class="tb-link">🌾 กษ.</a>
    <a href="/ministry-mhesi.html" class="tb-link">🔬 อว.</a>
    <a href="/management.html" class="tb-link gold">📊 Management</a>
    <span class="tb-link health">🏥 สธ. (กำลังดู)</span>
  </div>
</div>

<div id="content">
  <div class="loader"><div class="sp"></div><p style="margin-top:14px">กำลังโหลดข้อมูลกระทรวงสาธารณสุข…</p></div>
</div>

<footer>
  ⚙️ <b>ministry-moph.html</b> · ข้อมูลจาก <code>/ministry-data/moph.json</code> ·
  <a href="/management.html" style="color:var(--green);font-weight:700">Management Dashboard</a> ·
  <a href="https://g2g-ai-pool.fly.dev" style="color:var(--green);font-weight:700">PLAT Thailand</a>
</footer>

<script>
const DEPT_ICONS = {
  ddc: '🦠', dms: '🏥', dmh: '🧠', dch: '💊', fda: '💉', nhso: '🪙'
};

async function load() {
  try {
    let d;
    try {
      const r = await fetch('ministry-data/moph.json');
      if (!r.ok) throw new Error('Cannot load: ' + r.status);
      d = await r.json();
    } catch(e) {
      throw new Error('โหลด moph.json ไม่ได้: ' + e.message);
    }
    document.title = d.ministry.name_th + ' — PLAT Thailand';
    render(d);
    setTimeout(loadMophLive, 200);
  } catch(e) {
    document.getElementById('content').innerHTML =
      '<div style="padding:40px;text-align:center;color:#c0392b">⚠️ ' + e.message + '</div>';
  }
}

function render(d) {
  const m = d.ministry || {};
  document.getElementById('content').innerHTML =
    renderHero(d) +
    '<div id="moph-live-panel"><div style="padding:16px;text-align:center;color:#888;font-size:13px">📡 กำลังโหลดข้อมูล Live จาก MOPH API…</div></div>' +
    '<div class="main">' +
      renderKPIs(d) +
      renderPolicies(d) +
      renderDepartments(d) +
      renderRollout(d) +
    '</div>';
}

function renderHero(d) {
  const m = d.ministry || {};
  const k = d.key_kpis || {};
  return '<div class="hero"><div class="hero-inner">' +
    '<div>' +
      '<div class="hero-eyebrow">PLAT · กระทรวงสาธารณสุข</div>' +
      '<div class="hero-title">🏥 ' + m.name_th + '</div>' +
      '<div class="hero-sub">พัฒนาระบบสาธารณสุขไทยให้ครอบคลุม เข้าถึงได้ มีคุณภาพ และยั่งยืน</div>' +
      '<div class="hero-sub" style="margin-top:8px;font-size:12px;color:#a5d6a7">📜 จัดตั้ง พ.ศ. ' + (m.established||2485) + ' · ✅ บัตรทองครอบคลุม ' + (k.uc_coverage_pct||99) + '% ของประชากร</div>' +
    '</div>' +
    '<div class="hero-stats">' +
      '<div class="hero-stat"><div class="hs-lab">งบประมาณปี 2568</div><div class="hs-val">' + ((m.budget_2568||230000)/1000).toLocaleString('th-TH',{maximumFractionDigits:0}) + ' พันล้านบาท</div></div>' +
      '<div class="hero-stat"><div class="hs-lab">โรงพยาบาล</div><div class="hs-val">' + (k.hospital_count||1345).toLocaleString('th-TH') + '</div><div class="hs-sub">แห่งทั่วประเทศ</div></div>' +
      '<div class="hero-stat"><div class="hs-lab">สถานีอนามัย</div><div class="hs-val">' + (k.health_center_count||11458).toLocaleString('th-TH') + '</div><div class="hs-sub">รพ.สต. ทั่วประเทศ</div></div>' +
      '<div class="hero-stat"><div class="hs-lab">ครอบคลุม UC</div><div class="hs-val">' + (k.uc_coverage_pct||99) + '%</div><div class="hs-sub">บัตรทอง 30 บาท</div></div>' +
    '</div>' +
  '</div></div>';
}

function renderKPIs(d) {
  const k = d.key_kpis || {};
  const items = [
    { lab: 'โรงพยาบาล', val: (k.hospital_count||0).toLocaleString('th-TH'), sub: 'แห่งทั่วประเทศ' },
    { lab: 'สถานีอนามัย (รพ.สต.)', val: (k.health_center_count||0).toLocaleString('th-TH'), sub: 'แห่งทั่วประเทศ' },
    { lab: 'ครอบคลุม UC', val: (k.uc_coverage_pct||0) + '%', sub: 'บัตรทอง 30 บาท' },
    { lab: 'แพทย์ต่อ 10,000 คน', val: (k.doctor_per_10000||0), sub: 'เป้าหมาย 10 คน' },
    { lab: 'อายุขัยเฉลี่ย', val: (k.avg_life_expectancy||0) + ' ปี', sub: 'เป้าหมาย 80 ปี' },
    { lab: 'ตรวจสุขภาพเกษตรกร', val: (k.farmer_health_check_pct||0) + '%', sub: 'เป้าหมาย 80%' },
  ];
  let h = '<div class="section"><div class="sec-head">';
  h += '<div><div class="sec-title">📊 ตัวชี้วัดสำคัญ ปีงบประมาณ 2568</div>';
  h += '<div class="sec-sub">ข้อมูลจากกระทรวงสาธารณสุข และ สปสช.</div></div></div>';
  h += '<div class="kpi-grid">';
  items.forEach(function(i) {
    h += '<div class="kpi-card">';
    h += '<div class="kpi-lab">' + i.lab + '</div>';
    h += '<div class="kpi-val">' + i.val + '</div>';
    h += '<div class="kpi-unit">' + i.sub + '</div>';
    h += '</div>';
  });
  h += '</div></div>';
  return h;
}

function renderPolicies(d) {
  const policies = d.policies || [];
  let h = '<div class="section"><div class="sec-head">';
  h += '<div><div class="sec-title">🎯 นโยบายสำคัญ ปี 2568</div>';
  h += '<div class="sec-sub">นโยบายและโครงการสำคัญของกระทรวงสาธารณสุข</div></div></div>';
  h += '<div class="policy-grid">';
  policies.forEach(function(p) {
    h += '<div class="policy-card">';
    h += '<span class="pol-status">' + p.status + '</span>';
    h += '<div class="pol-name">' + p.title + '</div>';
    h += '<div class="pol-meta">' + p.description + '</div>';
    h += '<div class="pol-progress">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center">';
    h += '<span style="font-size:10px;color:var(--text3)">ความคืบหน้า</span>';
    h += '<span class="pol-pct">' + p.progress + '%</span>';
    h += '</div>';
    h += '<div class="pol-progress-bar"><div class="pol-progress-fill" style="width:' + p.progress + '%"></div></div>';
    h += '</div>';
    h += '<div class="pol-budget">งบประมาณ: ' + (p.budget||0).toLocaleString('th-TH') + ' ล้านบาท</div>';
    h += '</div>';
  });
  h += '</div></div>';
  return h;
}

function renderDepartments(d) {
  const depts = d.departments || [];
  let h = '<div class="section"><div class="sec-head">';
  h += '<div><div class="sec-title">🏛️ กรม / หน่วยงาน</div>';
  h += '<div class="sec-sub">หน่วยงานหลักภายในกระทรวงสาธารณสุข</div></div></div>';
  h += '<div class="dept-grid">';
  depts.forEach(function(dep) {
    const icon = DEPT_ICONS[dep.code] || '🏥';
    const isSpecial = (dep.code === 'nhso');
    h += '<div class="dept-card' + (isSpecial ? ' special' : '') + '">';
    h += '<div class="dept-head">';
    h += '<div class="dept-icon">' + icon + '</div>';
    h += '<div>';
    h += '<div class="dept-code">' + dep.name_en + '</div>';
    h += '<div class="dept-name">' + dep.name + '</div>';
    h += '</div></div>';
    h += '<div class="dept-fn">' + dep.focus + '</div>';
    h += '<div class="dept-stats">';
    h += '<div class="dept-stat-chip">งบ <b>' + (dep.budget||0).toLocaleString('th-TH') + '</b> ล้านบาท</div>';
    h += '<div class="dept-stat-chip">บุคลากร <b>' + (dep.staff||0).toLocaleString('th-TH') + '</b> คน</div>';
    h += '</div></div>';
  });
  h += '</div></div>';
  return h;
}

function renderRollout(d) {
  const provinces = d.province_rollout || [];
  let h = '<div class="section"><div class="sec-head">';
  h += '<div><div class="sec-title">🗺️ การขยายนโยบายรายจังหวัด</div>';
  h += '<div class="sec-sub">สถานะการดำเนินนโยบายสาธารณสุขในจังหวัดนำร่อง</div></div></div>';
  h += '<div class="rollout"><div class="phase-grid">';
  provinces.forEach(function(pv) {
    const cls = 'ph-' + pv.phase;
    h += '<div class="phase-card ' + cls + '">';
    h += '<div class="ph-label">Phase ' + pv.phase + '</div>';
    h += '<div class="ph-name">' + pv.province + '</div>';
    h += '<div class="ph-focus">' + pv.focus + '</div>';
    h += '<div class="ph-pct">' + pv.completion_pct + '%</div>';
    h += '<div class="ph-bar"><div class="ph-bar-fill" style="width:' + pv.completion_pct + '%"></div></div>';
    h += '</div>';
  });
  h += '</div></div></div>';
  return h;
}

async function loadMophLive() {
  const panel = document.getElementById('moph-live-panel');
  if (!panel) return;
  try {
    const [ovRes, kpiRes, provRes] = await Promise.all([
      fetch('/api/moph/overview', {headers: {'x-api-key': 'moph2026'}}),
      fetch('/api/moph/kpis', {headers: {'x-api-key': 'moph2026'}}),
      fetch('/api/moph/province-rollout', {headers: {'x-api-key': 'moph2026'}})
    ]);
    if (!ovRes.ok || !kpiRes.ok || !provRes.ok) throw new Error('API error');
    const ov = await ovRes.json();
    const kd = await kpiRes.json();
    const pd = await provRes.json();
    renderLivePanel(panel, ov, kd, pd);
  } catch(e) {
    panel.innerHTML = '<div style="padding:12px 16px;background:#fff3cd;border-radius:10px;font-size:11px;color:#856404;margin:16px">⚠️ Live API ไม่พร้อมใช้งาน — ข้อมูลแสดงจาก JSON cache</div>';
  }
}

function renderLivePanel(panel, ov, kd, pd) {
  const ts = ov.updated_at ? new Date(ov.updated_at).toLocaleString('th-TH') : '-';
  let h = '<div class="main"><div class="live-panel">';
  h += '<div class="live-panel-head">';
  h += '<div><div class="sec-title" style="color:var(--green)">📡 ข้อมูล Live — MOPH API</div>';
  h += '<div class="sec-sub">ดึงข้อมูลจาก g2g-ai-pool.fly.dev แบบ Real-time</div></div>';
  h += '<button class="refresh-btn" onclick="loadMophLive()">🔄 รีเฟรช</button>';
  h += '</div>';
  h += '<div class="live-badge"><span class="live-dot"></span> LIVE DATA</div>';
  h += '<div class="live-grid" style="margin-top:12px">';
  const kpis = kd.kpis || [];
  kpis.forEach(function(k) {
    h += '<div class="live-kpi">';
    h += '<div class="live-kpi-lab">' + k.name + '</div>';
    h += '<div class="live-kpi-val">' + k.value + '</div>';
    h += '<div class="live-kpi-ach">เป้า: ' + k.target + ' (' + k.achievement_pct + '%)</div>';
    h += '</div>';
  });
  h += '</div>';
  const provs = pd.provinces || [];
  if (provs.length > 0) {
    h += '<div style="margin-top:14px;font-size:12px;font-weight:800;color:var(--green)">🗺️ จังหวัดนำร่อง</div>';
    h += '<div class="live-prov-grid">';
    provs.forEach(function(pv) {
      h += '<div class="live-prov">';
      h += '<div class="live-prov-name">' + pv.province + '</div>';
      h += '<div class="live-prov-focus">' + pv.focus + '</div>';
      h += '<div class="live-prov-bar"><div class="live-prov-fill" style="width:' + pv.completion_pct + '%"></div></div>';
      h += '<div class="live-prov-pct">' + pv.completion_pct + '%</div>';
      h += '</div>';
    });
    h += '</div>';
  }
  h += '<div class="live-ts">อัปเดต: ' + ts + '</div>';
  h += '</div></div>';
  panel.innerHTML = h;
}

load();
</script>
